name: Food search regression (EPLAN 1.2)

on:
  push:
    branches:
      - eplan-1.2
    paths:
      - backend/app.py
      - backend/tests/test_food_search_*.py
      - backend/food_reference_catalog.py
      - backend/food_local_bootstrap.py
      - backend/tests/food_search_first_load_client.test.cjs
      - backend/tests/food_search_local_first_client.test.cjs
      - backend/tests/food_diary_edit_client.test.cjs
      - backend/tests/food_diary_meal_groups_client.test.cjs
      - backend/food_local_catalog.py
      - backend/food_manufacturer_catalog.py
      - backend/food_manufacturer_labels.json
      - backend/food_catalog_candidates.json
      - backend/food_local_nutrition.json
      - backend/check_food_local_catalog.py
      - backend/food_nutrition_audit.py
      - backend/static/calculator-prototype.js
      - backend/static/calculator-prototype.html
      - .github/workflows/food-search-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  food-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check backend syntax
        run: python -m py_compile backend/app.py backend/food_reference_catalog.py backend/food_local_catalog.py backend/food_manufacturer_catalog.py backend/food_local_bootstrap.py backend/check_food_local_catalog.py
      - name: Check local food catalogue provenance
        run: python backend/check_food_local_catalog.py
      - name: Check food prototype JavaScript syntax
        run: node --check backend/static/calculator-prototype.js
      - name: Check instant local food search (UA/RU/EN)
        run: node backend/tests/food_search_instant_client.test.cjs
      - name: Check local-first UI and external fetch fallback
        run: node backend/tests/food_search_local_first_client.test.cjs
      - name: Check first-visit food bootstrap without network
        run: node backend/tests/food_search_first_load_client.test.cjs
      - name: Check food diary edit, branded labels and delete undo
        run: node backend/tests/food_diary_edit_client.test.cjs
      - name: Check separate meal groups and full-day totals
        run: node backend/tests/food_diary_meal_groups_client.test.cjs
      - name: Run food search regression tests
        run: python -m unittest discover -s backend/tests -p 'test_food_search_*.py' -v
