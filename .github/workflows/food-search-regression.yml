name: Food search regression (EPLAN 1.2)

on:
  push:
    branches:
      - eplan-1.2
    paths:
      - backend/app.py
      - backend/tests/test_food_search_*.py
      - backend/food_reference_catalog.py
      - backend/food_local_catalog.py
      - backend/food_catalog_candidates.json
      - backend/food_local_nutrition.json
      - backend/check_food_local_catalog.py
      - backend/food_nutrition_audit.py
      - backend/static/calculator-prototype.js
      - backend/static/calculator-prototype.html
      - .github/workflows/food-search-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  food-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check backend syntax
        run: python -m py_compile backend/app.py backend/food_reference_catalog.py backend/food_local_catalog.py backend/check_food_local_catalog.py
      - name: Check local food catalogue provenance
        run: python backend/check_food_local_catalog.py
      - name: Check food prototype JavaScript syntax
        run: node --check backend/static/calculator-prototype.js
      - name: Run food search regression tests
        run: python -m unittest discover -s backend/tests -p 'test_food_search_*.py' -v
