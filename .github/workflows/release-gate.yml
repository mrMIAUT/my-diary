name: Release gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Debounce rapid PR updates
        if: github.event_name == 'pull_request'
        run: sleep 20
      - uses: actions/checkout@v4
      - name: Python syntax
        run: python3 -m py_compile backend/app.py
      - name: Release contract tests
        run: python3 -m unittest discover -s backend/tests -p 'test_*.py'
      - name: JavaScript syntax
        run: find backend/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Manifest syntax
        run: python3 -m json.tool backend/static/manifest.webmanifest >/dev/null

  dependency-audit:
    runs-on: ubuntu-latest
    needs: static-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install locked runtime dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pip-audit
      - name: Audit Python dependencies
        run: python -m pip_audit

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Launch and calculator smoke in Chromium
        run: node backend/tests/browser_startup_smoke.mjs

  food-api-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend runtime and API test client
        run: python -m pip install -r backend/requirements.txt httpx
      - name: Test authenticated food route and catalog fallback
        run: python backend/tests/food_api_smoke.py

  optional-rir-postgres:
    name: RIR migration rehearsal (PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eplan_rir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eplan_rir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend runtime
        run: python -m pip install -r backend/requirements.txt
      - name: Exercise legacy schema migration, program toggle, and template ON/OFF
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eplan_rir_test
          TRAINER_EMAIL: rir-ci@example.invalid
          TRAINER_PASSWORD: Ephemeral-CI-Trainer-Password-2026
        run: python backend/tests/optional_rir_postgres_smoke.py

  nutrition-postgres:
    name: Nutrition migration and client-plan save (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eplan_nutrition_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eplan_nutrition_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Legacy-plan migration, structured plan save, rollback and recipes
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eplan_nutrition_ci
          TRAINER_EMAIL: nutrition-ci@example.invalid
          TRAINER_PASSWORD: CI-Isolated-Nutrition-Password-2026
        run: python backend/tests/nutrition_postgres_integration_smoke.py
