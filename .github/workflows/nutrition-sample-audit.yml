name: Sample USDA and OFF nutrition audit

on:
  push:
    branches: [eplan-1.2]
    paths:
      - backend/run_nutrition_sample_audit.py
      - backend/food_nutrition_audit.py
      - .github/workflows/nutrition-sample-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sample real USDA and Open Food Facts API results
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python backend/run_nutrition_sample_audit.py
      - name: Upload read-only audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-audit-report
          path: nutrition-audit-report.json
          if-no-files-found: warn
