function enText(s){
 let lead=s.match(/^\s*/)?.[0]||'', trail=s.match(/\s*$/)?.[0]||'', t=s.trim();
 if(!t)return s;
 if(EN_MAP[t])return lead+EN_MAP[t]+trail;
 const months={Січень:'January',Лютий:'February',Березень:'March',Квітень:'April',Травень:'May',Червень:'June',Липень:'July',Серпень:'August',Вересень:'September',Жовтень:'October',Листопад:'November',Грудень:'December'};
 let mm=t.match(/^(Січень|Лютий|Березень|Квітень|Травень|Червень|Липень|Серпень|Вересень|Жовтень|Листопад|Грудень)(\s+\d{4})$/);
 if(mm)return lead+months[mm[1]]+mm[2]+trail;
 // Dynamic labels
 let m=t.match(/^День\s+(\d+)$/); if(m)return lead+'Day '+m[1]+trail;
 m=t.match(/^(\d+)\s+кроків$/); if(m)return lead+m[1]+' steps'+trail;
 m=t.match(/^(\d+)\s+хв$/); if(m)return lead+m[1]+' min'+trail;
 let out=t;
 EN_PARTS.forEach(([a,b])=>{out=out.split(a).join(b)});
 return lead+out+trail;
}
function translateTree(root=document.body){
 if(appLanguage!=='en'||!root)return;
 let walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let nodes=[];
 while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(n=>{n.nodeValue=enText(n.nodeValue)});
 root.querySelectorAll?.('input,textarea,select,button').forEach(el=>{
   if(el.placeholder)el.placeholder=enText(el.placeholder);
   if(el.title)el.title=enText(el.title);
   if(el.getAttribute('aria-label'))el.setAttribute('aria-label',enText(el.getAttribute('aria-label')));
 });
 document.documentElement.lang='en';
}

function clientProgressHTML(d){
 let period=window.clientProgressPeriod||'90',from=periodStart(period);
 let inPeriod=day=>!from||!day||day>=from;
 let sessions=(d.workout_sessions||[]).filter(x=>x.status==='finished'&&inPeriod((x.finished_at||x.started_at||'').slice(0,10)));
 let measures=(d.measurements||[]).filter(x=>x.day&&inPeriod(x.day)).slice().sort((a,b)=>a.day.localeCompare(b.day));
 let allMeasures=(d.measurements||[]).filter(x=>x.day).slice().sort((a,b)=>a.day.localeCompare(b.day));
 let firstM=measures[0],lastM=measures[measures.length-1];
 let weightNow=lastM&&+lastM.weight>0?+lastM.weight:null;
 let weightDelta=firstM&&lastM&&+firstM.weight>0&&+lastM.weight>0?(+lastM.weight-+firstM.weight):null;

 let sets=(d.result_sets||[]).filter(x=>x.day&&inPeriod(x.day));
 let byExercise={};
 sets.forEach(s=>{
   let key=(s.exercise||'Вправа').trim();
   (byExercise[key]||(byExercise[key]=[])).push(s);
 });
 let exerciseRows=Object.entries(byExercise).map(([name,xs])=>{
   let dates=[...new Set(xs.map(x=>x.day))].sort();
   let firstDay=dates[0],lastDay=dates[dates.length-1];
   let firstSets=xs.filter(x=>x.day===firstDay),lastSets=xs.filter(x=>x.day===lastDay);
   let best=a=>a.slice().sort((x,y)=>(+y.weight||0)-(+x.weight||0)||(+y.reps||0)-(+x.reps||0))[0]||{};
   let a=best(firstSets),b=best(lastSets);
   return {name,dates,first:a,last:b,change:(+b.weight||0)-(+a.weight||0),count:dates.length};
 }).sort((a,b)=>b.count-a.count||b.change-a.change);

 let statWeight=weightNow!==null?`${fmtProgress(weightNow)} кг`:'—';
 let statDelta=weightDelta!==null?`${weightDelta>0?'+':''}${fmtProgress(weightDelta)} кг`:'—';
 let periodLabel=period==='30'?'30 днів':period==='90'?'3 місяці':period==='180'?'6 місяців':'Весь час';

 return `<div id="clientProgress" class="client-progress-new">
  <div class="progress-hero">
   <div><h2>Мій прогрес</h2><p class="muted">Головне про твої результати в одному місці.</p></div>
   <div class="progress-periods">${[['30','1 міс.'],['90','3 міс.'],['180','6 міс.'],['all','Увесь час']].map(([v,t])=>`<button class="${period===v?'':'dark'}" onclick="window.clientProgressPeriod='${v}';refreshClientProgress()">${t}</button>`).join('')}</div>
  </div>

  ${exerciseRows.length?`<div class="card next-action-card"><span class="next-action-kicker">Найбільший прогрес</span><h2>${esc(exerciseRows.slice().sort((a,b)=>b.change-a.change)[0].name)}</h2><p class="muted">${fmtProgress(exerciseRows.slice().sort((a,b)=>b.change-a.change)[0].first.weight||0)} кг → <strong>${fmtProgress(exerciseRows.slice().sort((a,b)=>b.change-a.change)[0].last.weight||0)} кг</strong></p></div>`:''}
  <div class="progress-stats">
   <div class="progress-stat"><span>Тренувань</span><strong>${sessions.length}</strong><small>${periodLabel}</small></div>
   <div class="progress-stat"><span>Вага</span><strong>${statWeight}</strong><small>${lastM?.day?formatProgressDate(lastM.day):'Немає даних'}</small></div>
   <div class="progress-stat"><span>Зміна ваги</span><strong class="${weightDelta!==null&&weightDelta<0?'good':''}">${statDelta}</strong><small>за період</small></div>
  </div>

  <div class="card progress-section">
   <div class="progress-section-head"><div><h2>Силові показники</h2><p class="muted">Як змінюються твої робочі ваги.</p></div></div>
   ${exerciseRows.length?`<div class="strength-list">${exerciseRows.slice(0,window.clientStrengthAll?exerciseRows.length:5).map((x,i)=>strengthProgressCard(x,i)).join('')}</div>${exerciseRows.length>5?`<button class="dark progress-more" onclick="window.clientStrengthAll=!window.clientStrengthAll;refreshClientProgress()">${window.clientStrengthAll?'Згорнути':'Усі вправи'}</button>`:''}`:'<div class="progress-empty">Після кількох тренувань тут з’явиться динаміка робочих ваг.</div>'}
  </div>

  <div class="card progress-section">
   <button class="exercise-toggle" onclick="toggleCalendar('bodyProgressDetails',this)">
    <span><strong>Зміни тіла</strong><span class="muted" style="display:block;margin-top:5px">${lastM?'Останні актуальні заміри':'Заміри ще не додані'}</span></span><span class="arrow">⌄</span>
   </button>
   <div id="bodyProgressDetails" class="hidden" style="margin-top:14px">${bodyProgressHTML(allMeasures,period)}</div>
  </div>
 </div>`;
}
function fmtProgress(v){return Number(v).toFixed(1).replace('.0','')}
function formatProgressDate(s){try{return new Date(s+'T12:00:00').toLocaleDateString(appLanguage==='en'?'en-GB':'uk-UA',{day:'numeric',month:'short'})}catch(e){return s}}
function strengthProgressCard(x,i){
 let last=x.last||{},first=x.first||{},delta=x.change||0;
 let lastText=(+last.weight||0)>0?`${fmtProgress(last.weight)} кг × ${last.reps||0}`:`${last.reps||0} повт.`;
 let firstText=(+first.weight||0)>0?`${fmtProgress(first.weight)} кг × ${first.reps||0}`:`${first.reps||0} повт.`;
 let trend=x.dates.length>1?(delta>0?`+${fmtProgress(delta)} кг ↑`:delta<0?`${fmtProgress(delta)} кг ↓`:'без зміни'):'перше тренування';
 let details=x.dates.slice().reverse().map(day=>{
   let rows=(window.currentClientData.result_sets||[]).filter(s=>s.exercise===x.name&&s.day===day).sort((a,b)=>a.set_number-b.set_number);
   return `<div class="strength-history-row"><div><strong>${formatProgressDate(day)}</strong><span>${rows.map(s=>`${fmtProgress(s.weight||0)} кг × ${s.reps} · RIR ${s.rir}`).join(' · ')}</span></div></div>`;
 }).join('');
 return `<div class="strength-card">
  <button class="strength-main" onclick="toggleCalendar('strengthDetail${i}',this)">
   <span><strong>${esc(x.name)}</strong><small>${firstText} → ${lastText}</small></span>
   <span class="strength-change ${delta>0?'up':delta<0?'down':''}">${trend}</span>
   <span class="arrow">⌄</span>
  </button>
  <div id="strengthDetail${i}" class="hidden strength-detail">${details}</div>
 </div>`;
}
function bodyProgressHTML(xs,period){
 if(!xs.length)return `<div class="progress-empty">Додай перші заміри — і тут з’явиться динаміка.</div>`;
 let from=periodStart(period),f=xs.filter(x=>!from||x.day>=from),a=f[0]||xs[0],b=f[f.length-1]||xs[xs.length-1];
 let metrics=[['weight','Вага','кг'],['waist','Талія','см'],['chest','Груди','см'],['hips','Таз','см'],['thighs','Бедра','см'],['arms','Руки','см']];
 return `<div class="body-progress-grid">${metrics.filter(([k])=>+b[k]>0).map(([k,n,u])=>{let dv=(+a[k]>0)?(+b[k]-+a[k]):null;return `<div class="body-progress-item"><span>${n}</span><strong>${fmtProgress(b[k])} ${u}</strong><small>${dv===null?'':`${dv>0?'+':''}${fmtProgress(dv)} ${u}`}</small></div>`}).join('')}</div><div class="muted" style="margin-top:12px">Останній замір: ${formatProgressDate(b.day)}</div>`;
}
function refreshClientProgress(){let el=$('#clientProgress');if(!el)return;let tmp=document.createElement('div');tmp.innerHTML=clientProgressHTML(window.currentClientData||{});el.replaceWith(tmp.firstElementChild)}
function applyClientProgressPeriod(){window.clientProgressFrom=$('#clientProgressFrom')?.value||'';window.clientProgressTo=$('#clientProgressTo')?.value||'';window.clientProgressPeriod='custom';refreshClientProgress()}
function openClientHistory(){let head=document.querySelector('#clientCalendarBody')?.previousElementSibling;if(head){let body=document.querySelector('#clientCalendarBody');if(body?.classList.contains('hidden'))toggleCalendar('clientCalendarBody',head);head.scrollIntoView({behavior:'smooth',block:'start'})}}


function syncOverlayLock(){document.body.classList.toggle('overlay-open',!!document.querySelector('.modal')||!!document.querySelector('.side-drawer.open'))}
new MutationObserver(()=>syncOverlayLock()).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
new MutationObserver(ms=>{if(appLanguage==='en')ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)translateTree(n);else if(n.nodeType===3)n.nodeValue=enText(n.nodeValue)}))}).observe(document.body,{childList:true,subtree:true});
setTimeout(()=>translateTree(document.body),0);

 try{await api('/password-reset/confirm',{method:'POST',body:JSON.stringify({token,password:p})});localStorage.removeItem('fitSession');session=null;history.replaceState({},'',location.pathname);alert('Пароль змінено. Тепер увійдіть з новим паролем.');renderLogin()}catch(e){resetMsg.textContent=e.message}

 <div class="trainer-queue-head"><h1 style="margin:0">${filter==='review'?'На перевірку':filter==='ending'?'Завершується доступ':filter==='active'?'Активні клієнти':'Клієнти'}</h1>${filter!=='all'?`<button class="dark" onclick="window.trainerHomeFilter='all';trainerHome()">Показати всіх</button>`:''}</div>

async function quickExtendFromCard(cid,months){
 let clients=await api('/clients'),c=clients.find(x=>x.id===cid);if(!c)return;
 let base=c.access?.access_until&&c.access.access_until>=isoToday()?new Date(c.access.access_until+'T12:00:00'):new Date();
 base.setMonth(base.getMonth()+months);
 let until=`${base.getFullYear()}-${String(base.getMonth()+1).padStart(2,'0')}-${String(base.getDate()).padStart(2,'0')}`;
 await api('/clients/'+cid+'/access',{method:'PATCH',body:JSON.stringify({plan_code:c.access?.plan_code||'coaching',access_until:until})});
 trainerHome();
}

async function moveProgramBlock(dayName,blockIndex,direction){

   let d=window.currentClientData||{}, xs=(d.program||[]).filter(x=>x.day_name===dayName);

     if(x.superset_group){
       let b=blocks.find(v=>v.group===x.superset_group);
       if(b)b.ids.push(x.id);else blocks.push({group:x.superset_group,ids:[x.id]});
     }else blocks.push({group:'',ids:[x.id]});
   });
   let j=direction==='up'?blockIndex-1:blockIndex+1;
   if(j<0||j>=blocks.length)return;
   [blocks[blockIndex],blocks[j]]=[blocks[j],blocks[blockIndex]];
   let ordered_ids=blocks.flatMap(b=>b.ids);
   let cid=d.client.id;
   await api('/program/reorder',{method:'POST',body:JSON.stringify({client_id:cid,day_name:dayName,ordered_ids})});
   let byId=new Map((d.program||[]).map(x=>[x.id,x]));
   let daySet=new Set(ordered_ids), reordered=ordered_ids.map(id=>byId.get(id)).filter(Boolean), pos=0;
   d.program=(d.program||[]).map(x=>x.day_name===dayName?reordered[pos++]:x);
   window.currentClientData=d;
   let programPane=$('#program');if(programPane)programPane.innerHTML=programHTML(d);
 }catch(e){alert(e.message||'Не вдалося змінити порядок вправ')}

   let p=Object.fromEntries(parts.map(x=>[x.type,x.value]));
   return `${p.year}-${p.month}-${p.day}`;

function urlBase64ToUint8Array(base64String){
 const padding='='.repeat((4-base64String.length%4)%4),base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
 const raw=atob(base64);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}
function pushStorageKey(){
 return 'eplanPushEnabled_'+(session?.role==='trainer'?'trainer':('client_'+(session?.client_id||0)));
}
async function phoneNotificationEnabled(){
 try{
   if(!('Notification' in window)||Notification.permission!=='granted')return false;
   if(localStorage.getItem(pushStorageKey())==='1')return true;
   if(!('serviceWorker' in navigator)||!('PushManager' in window))return false;
   let reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
   if(sub){localStorage.setItem(pushStorageKey(),'1');return true}
   return false;
 }catch(e){return localStorage.getItem(pushStorageKey())==='1'&&('Notification' in window)&&Notification.permission==='granted'}
}
async function refreshPhoneNotificationButton(btn){
 if(!btn)return;
 let enabled=await phoneNotificationEnabled();
 btn.dataset.enabled=enabled?'1':'0';
 btn.textContent=enabled?'✓ Сповіщення на телефоні увімкнено':'🔔 Увімкнути сповіщення на телефоні';
 btn.classList.toggle('push-enabled',enabled);
}
async function enablePhoneNotifications(btn=null){
 if(await phoneNotificationEnabled()){await refreshPhoneNotificationButton(btn);return true}
 if(btn){btn.disabled=true;btn.textContent='Підключення…'}
 const done=async(ok)=>{if(btn){btn.disabled=false;await refreshPhoneNotificationButton(btn)}return ok};
 if(!window.isSecureContext){alert('Для push-сповіщень потрібен HTTPS.');return done(false)}
 if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
   alert('На iPhone push-сповіщення працюють у встановленому вебзастосунку «Є ПЛАН» через «Додати на початковий екран».');
   return done(false);
 }
 let permission=Notification.permission;
 if(permission!=='granted')permission=await Notification.requestPermission();
 if(permission!=='granted'){
   alert('Сповіщення не дозволені. Відкрий Налаштування iPhone → Сповіщення → Є ПЛАН та дозволь їх.');
   return done(false);
 }
 try{
   let reg=await navigator.serviceWorker.ready,key=await api('/push/public-key');
   if(!key.public_key)throw new Error('Push key unavailable');
   let sub=await reg.pushManager.getSubscription();
   if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlBase64ToUint8Array(key.public_key)});
   let j=sub.toJSON(),recipient=session?.role==='trainer'?'trainer':'client',clientId=session?.role==='client'?session.client_id:0;
   await api('/push/subscribe',{method:'POST',body:JSON.stringify({client_id:clientId,recipient,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth})});
   localStorage.setItem(pushStorageKey(),'1');
   return done(true);
 }catch(e){
   console.warn('Push subscribe failed',e);
   alert('Не вдалося підключити push-сповіщення. Перевір, що «Є ПЛАН» додано на початковий екран iPhone.');
   return done(false);
 }
}

   if(period==='custom')return (!customFrom||day>=customFrom)&&(!customTo||day<=customTo);
   return !from||day>=from;
 });
 let limit=window.trainerResultsLimit||5,shown=dates.slice(0,limit);

 if(!dates.length)return `<div class="card"><p class="muted">У вибраному періоді немає тренувань ${esc(dayName)}.</p></div>`;

 let cards=shown.map(day=>{
   let allIndex=allDates.indexOf(day),previous=allDates[allIndex+1]||null;
   let program=sessionProgramForDate(d,dayName,day);
   let exercises=program.filter(x=>(d.result_sets||[]).some(r=>r.program_id===x.id&&r.day===day));
   let workoutBodyId=`workoutResult_${dayName.replace(/[^a-zA-Z0-9]/g,'_')}_${day.replaceAll('-','_')}`;
   let cardSession=(d.workout_sessions||[]).filter(s=>s.day_name===dayName&&(s.started_at||'').slice(0,10)===day).sort((a,b)=>b.id-a.id)[0];
   return `<div class="card" data-workout-day="${esc(day)}" data-workout-session="${cardSession?.id||0}" style="padding:0;overflow:hidden">
    <button class="exercise-toggle" onclick="toggleWorkoutResult('${workoutBodyId}',this)" style="padding:20px 24px">
      <span><strong style="font-size:18px">${esc(dayName)} · ${esc(day)}</strong>${previous?`<span class="muted" style="display:block;margin-top:5px">порівняно з ${esc(previous)}</span>`:''}</span>
      <span class="arrow">⌄</span>
    </button>
    <div id="${workoutBodyId}" class="hidden" style="padding:0 24px 22px">
    ${(()=>{
      let ws=(d.workout_sessions||[]).filter(s=>s.day_name===dayName&&(s.started_at||'').slice(0,10)===day).sort((a,b)=>b.id-a.id)[0];
      if(!ws)return '';
      return `<div class="exercise" style="margin-bottom:14px">${ws.trainer_reviewed?`<strong style="color:#6ee787">Перевірено тренером ✓</strong>${ws.trainer_comment?`<div style="margin-top:7px">${esc(ws.trainer_comment)}</div>`:''}`:`<strong style="color:var(--yellow)">Нове тренування</strong><textarea id="reviewComment${ws.id}" placeholder="Коментар клієнту (необов’язково)..." style="width:100%;min-height:75px;margin-top:10px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit"></textarea><div class="review-actions"><button onclick="reviewWorkout(${ws.id},${d.client.id},true)">Надіслати та позначити перевіреним</button><button class="dark" onclick="reviewWorkout(${ws.id},${d.client.id},false)">Перевірено без коментаря</button></div>`}</div>`;
    })()}
    ${exercises.map(x=>{
      let cur=uniqueResultSets((d.result_sets||[]).filter(r=>r.program_id===x.id&&r.day===day)).sort((a,b)=>a.set_number-b.set_number);
      let prev=previous?uniqueResultSets((d.result_sets||[]).filter(r=>r.program_id===x.id&&r.day===previous)).sort((a,b)=>a.set_number-b.set_number):[];
      let bodyId=`trainerResult_${x.id}_${day.replaceAll('-','_')}`;
      return `<div class="exercise">
       <button class="exercise-toggle" onclick="toggleResultExercise('${bodyId}',this)">
        <span><strong>${esc(x.exercise)}</strong>${x.technique_url?` <a href="${esc(x.technique_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--yellow);font-size:13px">▶ Техніка</a>`:'' }${x.superset_group?`<span class="badge" style="margin-left:8px;color:var(--yellow)">Суперсет</span>`:''}<span class="muted" style="display:block;margin-top:5px">${cur.length} підходи</span></span><span class="arrow">⌄</span>
       </button>
       <div id="${bodyId}" class="hidden" style="margin-top:10px">${cur.map(s=>{
        let p=prev.find(z=>z.set_number===s.set_number);
        return `<div style="padding:8px 0;border-top:1px solid var(--line)"><div>Підхід ${s.set_number}: <strong>${s.weight} кг × ${s.reps}</strong> · RIR ${s.rir}</div>${p?`<div class="muted" style="margin-top:4px">Минулого ${p.weight} кг × ${p.reps} · різниця: вага ${resultDelta((+s.weight)-(+p.weight))} кг · повтори ${resultDelta((+s.reps)-(+p.reps))}</div>`:'<div class="muted" style="margin-top:4px">Немає попереднього результату для порівняння.</div>'}</div>`;
       }).join('')}</div>
      </div>`;
    }).join('')}
    </div>
   </div>`;
 }).join('');

 return cards+(dates.length>shown.length?`<div style="text-align:center;margin:16px 0 28px"><button class="dark" onclick="window.trainerResultsLimit=(window.trainerResultsLimit||5)+5;document.querySelector('#results').innerHTML=resultsHTML(window.currentClientData)">Показати ще (${dates.length-shown.length})</button></div>`:'');
}

}

function resultsHTML(d){
 let days=[...new Set((d.program||[]).map(x=>x.day_name))];
 if(!days.length)return `<div class="card"><h2>Історія тренувань</h2><p class="muted">Програма ще порожня.</p></div>`;
 let selectedDay=window.trainerResultsDay&&days.includes(window.trainerResultsDay)?window.trainerResultsDay:days[0];

 return `<div class="card"><h2>Історія тренувань</h2><p class="muted">Обери тренувальний день і період. Спочатку показуються 5 останніх тренувань.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">${days.map(day=>`<button class="${day===selectedDay?'':'dark'}" onclick="window.trainerResultsDay='${esc(day).replace(/'/g,"&#39;")}';window.trainerResultsLimit=5;document.querySelector('#results').innerHTML=resultsHTML(window.currentClientData)">${esc(day)}</button>`).join('')}</div>
  <div style="height:16px"></div>
  <div class="muted" style="margin-bottom:8px">Період</div>

   ${[['30','30 днів'],['90','3 місяці'],['180','6 місяців'],['all','Весь час']].map(([v,t])=>`<button class="${period===v?'':'dark'}" onclick="setResultsPeriod('${v}')">${t}</button>`).join('')}

  </div>
 </div>
 <div>${trainerDayResultsHTML(d,selectedDay)}</div>
 ${trainerMeasurementsResultsHTML(d)}`;

function trainerMeasurementsResultsHTML(d){
 let xs=(d.measurements||[]).filter(x=>x.day).slice().sort((a,b)=>a.day.localeCompare(b.day));

 return `<div class="card trainer-measure-results">

  ${measurementMetricCards(last,prev)}
  ${prev?`<div class="trainer-measure-change-title">Зміни з минулого разу <span>· ${formatProgressDate(prev.day)}</span></div>${measurementChangesHTML(last,prev)}`:''}
  <button class="exercise-toggle trainer-measure-history-toggle" onclick="toggleCalendar('trainerMeasurementHistory',this)"><span><strong>Історія замірів</strong><span class="muted" style="display:block;margin-top:5px">Переглянути всі контрольні точки</span></span><span class="arrow">⌄</span></button>
  <div id="trainerMeasurementHistory" class="hidden measurement-history">${xs.slice().reverse().map((x,i,rev)=>measurementHistoryCard(x,rev[i+1],cid)).join('')}</div>

let nutritionPlanDraft=null;
function planFromData(d){
 let items=(d.nutrition_plan||[]).map(x=>({meal_number:+x.meal_number||1,variant_number:+x.variant_number||1,content:x.content||'',sort:+x.sort||0}));
 if(!items.length&&d.client.meal_plan)items=[{meal_number:1,variant_number:1,content:d.client.meal_plan,sort:0}];
 if(!items.length)items=[{meal_number:1,variant_number:1,content:'',sort:0},{meal_number:2,variant_number:1,content:'',sort:0},{meal_number:3,variant_number:1,content:'',sort:0}];
 return items;
}
function mealPlanEditorHTML(d,editing=false){
 if(!nutritionPlanDraft)nutritionPlanDraft=planFromData(d);
 let nums=[...new Set(nutritionPlanDraft.map(x=>x.meal_number))].sort((a,b)=>a-b);
 return `<div class="card meal-plan-card"><button class="exercise-toggle meal-plan-head" onclick="toggleCalendar('nutritionPlanBody',this)"><span><strong>План харчування</strong><span class="muted" style="display:block;margin-top:5px">Прийоми їжі та альтернативні варіанти</span></span><span class="arrow">⌄</span></button><div id="nutritionPlanBody" class="hidden meal-plan-body">${nums.map(n=>mealEditorBlock(n,editing)).join('')}<div class="meal-actions">${editing?`<button class="dark icon-btn" onclick="addMealBlock()">${uiIcon('plus')} Додати прийом їжі</button>`:''}</div></div></div>`;
}
function mealEditorBlock(n,editing){
 let xs=nutritionPlanDraft.filter(x=>x.meal_number===n).sort((a,b)=>a.variant_number-b.variant_number);
 if(!editing)return `<div class="meal-view"><strong>Прийом їжі ${n}</strong>${xs.filter(x=>x.content.trim()).map(x=>`<div class="meal-option"><span class="variant-pill">Варіант ${x.variant_number}</span><div style="white-space:pre-wrap;line-height:1.55;margin-top:7px">${esc(x.content)}</div></div>`).join('')||'<div class="muted" style="margin-top:8px">Ще не заповнено.</div>'}</div>`;
 return `<div class="meal-editor"><div class="meal-editor-head"><strong>Прийом їжі ${n}</strong>${nutritionPlanDraft.some(x=>x.meal_number!==n)?`<button class="dark icon-btn" onclick="removeMealBlock(${n})">${uiIcon('trash')} Видалити</button>`:''}</div>${xs.map(x=>`<div class="meal-variant"><div class="between"><span class="muted">Варіант ${x.variant_number}</span>${xs.length>1?`<button class="dark icon-btn" onclick="removeMealVariant(${n},${x.variant_number})">${uiIcon('trash')}</button>`:''}</div><textarea data-meal="${n}" data-variant="${x.variant_number}" oninput="updateMealDraft(this)" placeholder="Продукти, кількість, примітки...">${esc(x.content)}</textarea></div>`).join('')}<div class="meal-actions"><button class="dark icon-btn" onclick="addMealVariant(${n})">${uiIcon('plus')} Додати варіант</button></div></div>`;
}
function updateMealDraft(el){let x=nutritionPlanDraft.find(v=>v.meal_number===+el.dataset.meal&&v.variant_number===+el.dataset.variant);if(x)x.content=el.value}
function rerenderNutritionPlan(editing=true){let old=$('#nutritionPlanBody'),wasOpen=old&&!old.classList.contains('hidden');let host=$('#nutritionPlanHost');if(host)host.innerHTML=mealPlanEditorHTML(window.currentClientData,editing);if(wasOpen){let b=$('#nutritionPlanBody');if(b)b.classList.remove('hidden')}}
function addMealBlock(){let n=Math.max(0,...nutritionPlanDraft.map(x=>x.meal_number))+1;nutritionPlanDraft.push({meal_number:n,variant_number:1,content:'',sort:0});rerenderNutritionPlan(true)}
function removeMealBlock(n){nutritionPlanDraft=nutritionPlanDraft.filter(x=>x.meal_number!==n);let nums=[...new Set(nutritionPlanDraft.map(x=>x.meal_number))].sort((a,b)=>a-b);nutritionPlanDraft=nutritionPlanDraft.map(x=>({...x,meal_number:nums.indexOf(x.meal_number)+1}));rerenderNutritionPlan(true)}
function addMealVariant(n){let xs=nutritionPlanDraft.filter(x=>x.meal_number===n),v=Math.max(0,...xs.map(x=>x.variant_number))+1;nutritionPlanDraft.push({meal_number:n,variant_number:v,content:'',sort:0});rerenderNutritionPlan(true)}
function removeMealVariant(n,v){nutritionPlanDraft=nutritionPlanDraft.filter(x=>!(x.meal_number===n&&x.variant_number===v));let xs=nutritionPlanDraft.filter(x=>x.meal_number===n).sort((a,b)=>a.variant_number-b.variant_number);xs.forEach((x,i)=>x.variant_number=i+1);rerenderNutritionPlan(true)}
function nutritionHTML(d){let c=d.client;nutritionPlanDraft=planFromData(d);let locked=!!(c.kcal||c.protein||c.fat||c.carbs||(d.nutrition_plan||[]).length||c.meal_plan);let dis=locked?' disabled':'';return `<div class="card"><h2>Цільове харчування</h2><p class="muted">Вкажи калорійність та БЖВ клієнта.</p><div class="grid"><div><div class="muted">Ккал</div><input id="nkcal" type="number" value="${c.kcal||0}"${dis}></div><div><div class="muted">Білки, г</div><input id="nprotein" type="number" value="${c.protein||0}"${dis}></div><div><div class="muted">Жири, г</div><input id="nfat" type="number" value="${c.fat||0}"${dis}></div><div><div class="muted">Вуглеводи, г</div><input id="ncarbs" type="number" value="${c.carbs||0}"${dis}></div></div><br><div id="nutritionActions">${locked?`<button class="dark icon-btn" onclick="editNutritionTargets()">${uiIcon('edit')} Редагувати</button><span class="muted" style="margin-left:12px">Збережено ✓</span>`:`<button onclick="saveNutritionTargets(${c.id})">Зберегти харчування</button>`}</div></div><div id="nutritionPlanHost">${mealPlanEditorHTML(d,false)}</div>`}
function editNutritionTargets(){['nkcal','nprotein','nfat','ncarbs'].forEach(id=>{let el=$('#'+id);if(el)el.disabled=false});nutritionPlanDraft=planFromData(window.currentClientData);let a=$('#nutritionActions');if(a)a.innerHTML=`<button onclick="saveNutritionTargets(${window.currentClientData.client.id})">Зберегти харчування</button><button class="dark" style="margin-left:8px" onclick="document.querySelector('#nutrition').innerHTML=nutritionHTML(window.currentClientData)">Скасувати</button>`;let host=$('#nutritionPlanHost');if(host)host.innerHTML=mealPlanEditorHTML(window.currentClientData,true)}
async function saveNutritionTargets(cid){let meals=(nutritionPlanDraft||[]).filter(x=>x.content.trim()).map((x,i)=>({...x,sort:i}));let body={kcal:+nkcal.value||0,protein:+nprotein.value||0,fat:+nfat.value||0,carbs:+ncarbs.value||0,meal_plan:'',meals};await api('/client/'+cid+'/nutrition',{method:'PATCH',body:JSON.stringify(body)});let d=await api('/client/'+cid);window.currentClientData=d;nutritionPlanDraft=null;let box=$('#nutrition');if(box)box.innerHTML=nutritionHTML(d)}
function clientMealPlanHTML(d){let items=planFromData(d).filter(x=>x.content.trim());if(!items.length)return '';let nums=[...new Set(items.map(x=>x.meal_number))].sort((a,b)=>a-b);return `<div class="card meal-plan-card"><button class="exercise-toggle meal-plan-head" onclick="toggleCalendar('clientMealPlanBody',this)"><span><strong>Мій план харчування</strong><span class="muted" style="display:block;margin-top:5px">Натисни, щоб переглянути прийоми їжі</span></span><span class="arrow">⌄</span></button><div id="clientMealPlanBody" class="hidden meal-plan-body">${nums.map(n=>{let xs=items.filter(x=>x.meal_number===n).sort((a,b)=>a.variant_number-b.variant_number);return `<div class="meal-view"><strong>Прийом їжі ${n}</strong>${xs.map(x=>`<div class="meal-option"><span class="variant-pill">Варіант ${x.variant_number}</span><div style="white-space:pre-wrap;line-height:1.55;margin-top:7px">${esc(x.content)}</div></div>`).join('')}</div>`}).join('')}</div></div>`}
function measurementRowHTML(x){let vals=[];if(+x.weight)vals.push(`<strong>${x.weight} кг</strong>`);if(+x.waist)vals.push(`Талія ${x.waist} см`);if(+x.hips)vals.push(`Таз ${x.hips} см`);if(+x.thighs)vals.push(`Стегна ${x.thighs} см`);if(+x.arms)vals.push(`Руки ${x.arms} см`);if(+x.chest)vals.push(`Груди ${x.chest} см`);return `<div class="exercise">${x.day?`<div class="muted" style="margin-bottom:7px">${esc(x.day)}</div>`:''}${vals.join(' · ')||'<span class="muted">Немає значень</span>'}</div>`}
function measureHTML(d){return `<div class="card"><h2>Заміри клієнта</h2><p class="muted">Ці дані заповнює клієнт у своєму кабінеті. Тут доступний лише перегляд історії.</p>${d.measurements.length?d.measurements.slice().reverse().map(x=>measurementRowHTML(x)).join(''):'<p class="muted">Заміри відсутні.</p>'}</div>`}
function measurementDaysLeft(lastDay){
 if(!lastDay)return 0;
 let last=new Date(lastDay+'T12:00:00'),next=new Date(last);next.setDate(next.getDate()+30);
 return Math.ceil((next-new Date())/86400000);
}
function measurementMetricCards(last,prev){
 let metrics=[['weight','Вага','кг'],['waist','Талія','см'],['hips','Таз','см'],['thighs','Стегна','см'],['arms','Руки','см'],['chest','Груди','см']];
 return `<div class="measurement-metric-grid">${metrics.filter(([k])=>+last?.[k]>0).map(([k,n,u])=>{
   let v=+last[k],pv=+prev?.[k],delta=pv>0?v-pv:null;
   return `<div class="measurement-metric"><span>${n}</span><strong>${fmtProgress(v)} <small>${u}</small></strong>${delta===null?'<em>—</em>':`<em class="${delta<0?'down':delta>0?'up':''}">${delta>0?'+':''}${fmtProgress(delta)} ${u}</em>`}</div>`;
 }).join('')}</div>`;
}
function measurementFormHTML(cid,early=false){
 return `<div class="measurement-form ${early?'early':''}">
  <div class="measurement-tip"><strong>Як робити заміри</strong><span>Вранці, натщесерце та в однакових умовах. Бажано — раз на 30 днів.</span></div>
  <div class="measure-grid"><div><label>Вага, кг</label><input id="mWeight" type="number" step="0.1" placeholder="Напр. 89"></div><div><label>Талія, см</label><input id="mWaist" type="number" step="0.1" placeholder="Напр. 82"></div><div><label>Таз, см</label><input id="mHips" type="number" step="0.1" placeholder="Напр. 98"></div><div><label>Стегна, см</label><input id="mThighs" type="number" step="0.1" placeholder="Напр. 60"></div><div><label>Руки, см</label><input id="mArms" type="number" step="0.1" placeholder="Напр. 39"></div><div><label>Груди, см</label><input id="mChest" type="number" step="0.1" placeholder="Напр. 108"></div></div>
  <div class="measurement-form-actions"><button onclick="saveMeasurement(${cid},event)">Зберегти заміри</button>${early?`<button class="dark" onclick="document.getElementById('earlyMeasurementForm').classList.add('hidden')">Скасувати</button>`:''}</div>
 </div>`;
}
function measurementHistoryCard(x,prev,cid=null){
 let metrics=[['weight','Вага','кг'],['waist','Талія','см'],['hips','Таз','см'],['thighs','Стегна','см'],['arms','Руки','см'],['chest','Груди','см']];
 let ownerId=+(cid||((session&&session.role==='client')?session.client_id:0)||0);
 let canDelete=ownerId>0&&session&&session.role==='client'&&x.id;
 return `<div class="measurement-history-card">
   <div class="measurement-history-date">${formatProgressDate(x.day)}</div>
   <div class="measurement-history-values">${metrics.filter(([k])=>+x[k]>0).map(([k,n,u])=>{let d=+prev?.[k]>0?(+x[k]-+prev[k]):null;return `<span><b>${n}</b> ${fmtProgress(x[k])} ${u}${d===null?'':` <small>${d>0?'+':''}${fmtProgress(d)}</small>`}</span>`}).join('')}</div>
   ${canDelete?`<button type="button" class="measurement-delete" aria-label="Видалити замір" title="Видалити замір" onclick="deleteMeasurement(${ownerId},${+x.id},'${x.day}')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></button>`:''}
 </div>`;
}
function clientMeasurementsHTML(d,cid){
 let xs=(d.measurements||[]).filter(x=>x.day).slice().sort((a,b)=>a.day.localeCompare(b.day)),last=xs[xs.length-1],prev=xs[xs.length-2],left=last?measurementDaysLeft(last.day):0,due=!last||left<=0;
 let nextDate=last?(()=>{let z=new Date(last.day+'T12:00:00');z.setDate(z.getDate()+30);return z.toISOString().slice(0,10)})():isoToday();

function workoutCycleState(d,groups){
 let days=Object.keys(groups||{}),done=[];
 if(!days.length)return {done,next:null};
 let idx=0;
 let sessions=(d.workout_sessions||[]).filter(x=>x.status==='finished').slice().sort((a,b)=>new Date(a.finished_at||a.started_at||0)-new Date(b.finished_at||b.started_at||0));
 for(let x of sessions){
   let day=x.day_name;
   if(day===days[idx]){
     idx++;
     if(idx===days.length)idx=0;
   }else if(day===days[0]) idx=1;
 }
 done=days.slice(0,idx);
 return {done,next:days[idx]||days[0]};
}

async function startRestTimer(seconds,sourceBtn=null){
 document.querySelectorAll('.rest-timer-choices button').forEach(b=>b.classList.remove('selected'));
 if(sourceBtn)sourceBtn.classList.add('selected');
 await unlockTimerSound();
 await ensureTimerNotifications();
 let end=Date.now()+seconds*1000;localStorage.setItem(REST_TIMER_KEY,String(end));
 $('#restTimerChoices')?.classList.remove('hidden');$('#restTimerActions')?.classList.remove('hidden');
 startRestTimerTicker();syncRestTimerWorker(end);renderFloatingRestTimer();
}
function addRestTimer(seconds){
 let end=Math.max(Date.now(),restTimerEnd())+seconds*1000;localStorage.setItem(REST_TIMER_KEY,String(end));
 startRestTimerTicker();syncRestTimerWorker(end);renderFloatingRestTimer();
}
function cancelRestTimer(){
 localStorage.removeItem(REST_TIMER_KEY);document.querySelectorAll('.rest-timer-choices button').forEach(b=>b.classList.remove('selected'));if(restTimerInterval){clearInterval(restTimerInterval);restTimerInterval=null}
 navigator.serviceWorker?.controller?.postMessage({type:'CANCEL_REST_TIMER'});
 updateRestTimerUI(0);document.querySelector('#floatingRestTimer')?.remove();
}
function customRestTimer(){
 let raw=prompt('Введи час відпочинку у секундах, наприклад 150');
 let sec=parseInt(raw||'',10);if(sec>0&&sec<=3600)startRestTimer(sec);
}
function startRestTimerTicker(){
 if(restTimerInterval)clearInterval(restTimerInterval);
 updateRestTimerUI(restTimerRemaining());
 restTimerInterval=setInterval(()=>{let s=restTimerRemaining();updateRestTimerUI(s);if(s<=0){clearInterval(restTimerInterval);restTimerInterval=null;finishRestTimer()}},250);
}
function updateRestTimerUI(s){
 let d=$('#restTimerDisplay');if(d)d.textContent=s?formatRestTimer(s):'Готовий до старту';
 let a=$('#restTimerActions');if(a)a.classList.toggle('hidden',!s);
 let f=$('#floatingRestTimerValue');if(f)f.textContent=formatRestTimer(s);
}
async function unlockTimerSound(){
 try{let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;restTimerAudioCtx=restTimerAudioCtx||new AC();if(restTimerAudioCtx.state==='suspended')await restTimerAudioCtx.resume()}catch(e){}
}
function timerBeep(){
 try{
  let AC=window.AudioContext||window.webkitAudioContext,ctx=restTimerAudioCtx||new AC();restTimerAudioCtx=ctx;
  [0,.22,.44].forEach(t=>{let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.16);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.18)});
 }catch(e){}
 try{navigator.vibrate?.([180,90,180,90,260])}catch(e){}
}
async function finishRestTimer(){
 if(!restTimerEnd())return;
 localStorage.removeItem(REST_TIMER_KEY);document.querySelectorAll('.rest-timer-choices button').forEach(b=>b.classList.remove('selected'));updateRestTimerUI(0);document.querySelector('#floatingRestTimer')?.remove();timerBeep();
 if(document.visibilityState==='visible'&&Notification.permission==='granted'){
  try{let reg=await navigator.serviceWorker.ready;reg.showNotification('Є ПЛАН · Відпочинок завершено',{body:'Час починати наступний підхід.',icon:'/static/icon-192.png',badge:'/static/icon-192.png',tag:'eplan-rest-finished',renotify:true})}catch(e){}
 }
}
async function syncRestTimerWorker(end){
 try{let reg=await navigator.serviceWorker.ready;(reg.active||navigator.serviceWorker.controller)?.postMessage({type:'REST_TIMER',end})}catch(e){}
}
function renderFloatingRestTimer(){
 let s=restTimerRemaining();if(!s){document.querySelector('#floatingRestTimer')?.remove();return}
 let el=$('#floatingRestTimer');if(!el){document.body.insertAdjacentHTML('beforeend',`<button id="floatingRestTimer" class="floating-rest-timer" onclick="window.scrollTo({top:0,behavior:'smooth'})">⏱ <span id="floatingRestTimerValue">${formatRestTimer(s)}</span></button>`)}
 else $('#floatingRestTimerValue').textContent=formatRestTimer(s);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&restTimerEnd()){if(restTimerRemaining()<=0)finishRestTimer();else{startRestTimerTicker();renderFloatingRestTimer()}}});
window.addEventListener('focus',()=>{if(restTimerEnd()){startRestTimerTicker();renderFloatingRestTimer()}});
setTimeout(()=>{if(restTimerEnd()){if(restTimerRemaining()<=0)finishRestTimer();else{startRestTimerTicker();syncRestTimerWorker(restTimerEnd());renderFloatingRestTimer()}}},500);

  sets.push({set_number:n,weight:+w.value,reps:+r.value,rir:+i.value||0})
 }
 if(!sets.length)return alert('Заповни хоча б один підхід');
 await api('/result-sets',{method:'POST',body:JSON.stringify({client_id:cid,program_id:pid,exercise,sets})});
 let body=$('#exerciseBody'+pid);
 if(body){
   body.innerHTML=`<div class="exercise" style="margin-top:12px"><strong>Виконано ✓</strong>${sets.map(s=>`<div class="muted" style="margin-top:6px">Підхід ${s.set_number}: ${s.weight} кг × ${s.reps} · RIR ${s.rir}</div>`).join('')}<div style="margin-top:12px"><button class="dark" onclick="clientCabinet(${cid})">Редагувати</button></div></div>`;
   body.classList.add('hidden');
   let toggle=body.previousElementSibling;if(toggle)toggle.classList.remove('open');
 }
 let d=await api('/client/'+cid);window.currentClientData=d;
 let cal=$('#clientCalendar');if(cal)cal.innerHTML=calendarHTML(d,'client');
 setTimeout(async()=>{await clientCabinet(cid);focusNextUnfinishedExercise(pid)},250);
}
window.addEventListener('popstate',async e=>{
 if(!session)return;
 document.querySelectorAll('.modal').forEach(x=>x.remove());closeSideMenu();
 let st=e.state||{};
 if(st.eplanPage==='calendarDay'&&st.eplanDay){
   if(session.role==='trainer'&&st.eplanClient){selected=st.eplanClient;window.currentClientData=await api('/client/'+st.eplanClient)}
   else if(session.role==='client'&&session.client_id){window.currentClientData=await api('/client/'+session.client_id)}
   showCalendarDay(st.eplanDay,null,false);return;
 }
 if(session.role==='trainer'){
   if(st.eplanPage==='client'&&st.eplanClient){await openClient(st.eplanClient,st.eplanTab||'profile')}
   else{selected=null;window.currentClientData=null;await trainerHome()}
 }else if(session.role==='client'){await clientCabinet(session.client_id);if(st.eplanSection==='history')showClientSection('history')}
});

let startupResetToken=new URLSearchParams(location.search).get('reset');
if(startupResetToken){renderResetPassword(startupResetToken)}else{
 if(!history.state?.eplanPage)history.replaceState(session?.role==='client'?{eplanPage:'clientHome',eplanClient:session.client_id}:{eplanPage:'clients'},'',location.pathname+location.search);
 route()
}

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('/sw.js', {scope:'/'});
      reg.update();
      setTimeout(autoRegisterPhoneNotifications,300);
      setTimeout(handleNotificationDeepLink,450);
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    } catch (e) {
      console.warn('PWA service worker registration failed', e);
    }
  });
}
</script>

<script>
(function(){
  const splash=document.getElementById('eplanSplash');
  if(!splash)return;
  const started=performance.now();
  const hide=()=>{
    const wait=Math.max(0,900-(performance.now()-started));
    setTimeout(()=>{
      splash.classList.add('is-hidden');
      setTimeout(()=>splash.remove(),280);
    },wait);
  };
  if(document.readyState==='complete') hide();
  else window.addEventListener('load',hide,{once:true});
})();
</script>
