<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Зроби себе зі мною</title><style>
:root{--bg:#080909;--card:#19191c;--card2:#101012;--line:#303035;--text:#f4f4f5;--muted:#9a9aa3;--yellow:#ffd000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:28px 20px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-weight:900;font-size:28px}.brand span{color:var(--yellow)}h1,h2,h3{margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:22px}.client{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.between{display:flex;justify-content:space-between;gap:14px;align-items:center}input{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px}button{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--yellow);color:#080808}button.dark{background:#29292e;color:white}button.danger{background:#402020;color:#ffb8b8}.muted{color:var(--muted)}.big{font-size:32px;font-weight:900}.badge{background:#29292e;border-radius:999px;padding:8px 13px}.exercise{background:var(--card2);border:1px solid #29292e;border-radius:16px;padding:16px;margin:10px 0}.exercise strong{font-size:18px}.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 20px}.tabs button{white-space:nowrap}.hidden{display:none!important}.login{max-width:650px;margin:10vh auto}.login .brand{font-size:46px;margin-bottom:35px}.login input{margin:7px 0}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal .card{width:min(680px,100%);max-height:90vh;overflow:auto}.setrow{display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:10px;align-items:center;margin-top:10px}.setnum{font-weight:900;text-align:center}.sethead{font-size:12px;color:var(--muted);text-align:center}
@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:20px 14px 90px}.brand{font-size:21px}.login .brand{font-size:38px}.card{padding:18px;border-radius:20px}.setrow{grid-template-columns:52px 1fr 1fr 1fr;gap:6px}.setrow input{padding:11px 7px;font-size:14px}}
</style></head><body><div id="app"></div><script>
const A='/api'; const $=s=>document.querySelector(s);let session=JSON.parse(localStorage.getItem('fitSession')||'null');let selected=null;
async function api(path,opt={}){let r=await fetch(A+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(!r.ok){let x;try{x=await r.json()}catch{};throw new Error(x?.detail||'Помилка сервера')}return r.status===204?null:r.json()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shell(content){return `<div class="wrap"><div class="top"><div class="brand">ЗРОБИ СЕБЕ <span>ЗІ МНОЮ</span></div><button class="dark" onclick="logout()">Вийти</button></div>${content}</div>`}
function logout(){localStorage.removeItem('fitSession');session=null;renderLogin()}
function renderLogin(){app.innerHTML=`<div class="wrap login"><div class="brand">ЗРОБИ СЕБЕ<br><span>ЗІ МНОЮ</span></div><div class="card"><h1>Вхід</h1><input id="email" value="trainer@demo.local" placeholder="Email"><input id="pass" type="password" value="trainer123" placeholder="Пароль"><p id="err" class="muted"></p><button onclick="login()">Увійти</button><p class="muted">Тренер: trainer@demo.local / trainer123<br>Клієнт: використай email і пароль, створені тренером</p></div></div>`}
async function login(){try{let s=await api('/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});session=s;localStorage.setItem('fitSession',JSON.stringify(s));route()}catch(e){err.textContent=e.message}}
async function route(){if(!session)return renderLogin();if(session.role==='trainer')return trainerHome();return clientCabinet(session.client_id)}
async function trainerHome(){let cs=await api('/clients');app.innerHTML=shell(`<div class="card"><h1>Панель тренера</h1><p class="muted">Активних клієнтів: ${cs.length}</p><button onclick="newClient()">+ Додати клієнта</button></div><h1>Клієнти</h1>${cs.map(c=>`<div class="card client" onclick="openClient(${c.id})"><div class="between"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.goal||'Без цілі')} · ${c.weight||0} кг</div></div><span class="badge">${esc(c.status||'Активний')}</span></div></div>`).join('')}`)}
function newClient(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="card"><div class="between"><h2>Новий клієнт</h2><button class="dark" onclick="modal.remove()">✕</button></div><div class="grid"><input id="n" placeholder="Ім'я"><input id="e" placeholder="Email"><input id="p" value="client123" placeholder="Пароль"><input id="g" placeholder="Ціль"><input id="w" type="number" placeholder="Вага, кг"><input id="k" type="number" placeholder="Ккал"><input id="pr" type="number" placeholder="Білки"><input id="f" type="number" placeholder="Жири"><input id="ca" type="number" placeholder="Вуглеводи"></div><p id="me" class="muted"></p><button onclick="createClient()">Створити клієнта</button></div></div>`)}
async function createClient(){try{await api('/clients',{method:'POST',body:JSON.stringify({name:n.value,email:e.value,password:p.value,goal:g.value,weight:+w.value||0,kcal:+k.value||0,protein:+pr.value||0,fat:+f.value||0,carbs:+ca.value||0})});modal.remove();trainerHome()}catch(x){me.textContent=x.message}}
async function openClient(id){selected=id;let d=await api('/client/'+id),c=d.client;app.innerHTML=shell(`<button class="dark" onclick="trainerHome()">← До клієнтів</button><div style="height:15px"></div><div class="card"><div class="between"><div><h1>${esc(c.name)}</h1><div class="muted">${esc(c.email)} · ${esc(c.goal||'Без цілі')}</div></div><div class="big">${c.weight||0} кг</div></div></div><div class="tabs"><button onclick="showTab('program',this)">Програма</button><button class="dark" onclick="showTab('results',this)">Результати</button><button class="dark" onclick="showTab('nutrition',this)">Харчування</button><button class="dark" onclick="showTab('progress',this)">Заміри</button></div><div id="program" class="tab">${programHTML(d)}</div><div id="results" class="tab hidden">${resultsHTML(d)}</div><div id="nutrition" class="tab hidden">${nutritionHTML(d)}</div><div id="progress" class="tab hidden">${measureHTML(d)}</div>`)}
function showTab(id,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$('#'+id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.add('dark'));btn.classList.remove('dark')}
function programHTML(d){let groups={};d.program.forEach(x=>(groups[x.day_name]??=[]).push(x));return `<div class="card"><h2>Програма тренувань</h2><div class="grid"><input id="dn" placeholder="День, напр. День 1"><input id="ex" placeholder="Вправа"><input id="st" type="number" value="3" placeholder="Підходи"><input id="rp" value="8-12" placeholder="Повтори"><input id="rr" type="number" value="2" placeholder="RIR"></div><br><button onclick="addExercise()">+ Додати вправу</button></div>${Object.entries(groups).length?Object.entries(groups).map(([day,xs])=>`<div class="card"><h2>${esc(day)}</h2>${xs.map(x=>`<div class="exercise between"><div><strong>${esc(x.exercise)}</strong><div class="muted">${x.sets} підходи × ${esc(x.reps)} · RIR ${x.target_rir}</div></div><button class="danger" onclick="deleteExercise(${x.id})">Видалити</button></div>`).join('')}</div>`).join(''):`<div class="card muted">Програма ще порожня.</div>`}
async function addExercise(){if(!dn.value||!ex.value)return alert('Вкажи день і вправу');await api('/program',{method:'POST',body:JSON.stringify({client_id:selected,day_name:dn.value,exercise:ex.value,sets:+st.value||3,reps:rp.value||'8-12',target_rir:+rr.value||2})});openClient(selected)}
async function deleteExercise(id){if(confirm('Видалити вправу?')){await api('/program/'+id,{method:'DELETE'});openClient(selected)}}
function resultsHTML(d){let detailed=d.result_sets||[];let by={};detailed.forEach(x=>{let k=x.day+'|'+x.program_id+'|'+x.exercise;(by[k]??=[]).push(x)});let detailHTML=Object.values(by).map(xs=>`<div class="exercise"><strong>${esc(xs[0].exercise)}</strong><div class="muted">${esc(xs[0].day)}</div>${xs.map(s=>`<div style="margin-top:7px">Підхід ${s.set_number}: <strong>${s.weight} кг × ${s.reps}</strong> · RIR ${s.rir}</div>`).join('')}</div>`).join('');let old=(d.results||[]).map(x=>`<div class="exercise"><strong>${esc(x.exercise)}</strong><div class="muted">${esc(x.day)} · ${x.weight} кг × ${x.reps} · ${x.sets} підходи · RIR ${x.rir}</div></div>`).join('');return `<div class="card"><h2>Результати тренувань</h2>${detailHTML||old||'<p class="muted">Клієнт ще не записував результати.</p>'}</div>`}
function nutritionHTML(d){let c=d.client;return `<div class="card"><h2>Цільове харчування</h2><div class="grid"><div class="exercise">Ккал<br><strong>${c.kcal||0}</strong></div><div class="exercise">Білки<br><strong>${c.protein||0} г</strong></div><div class="exercise">Жири<br><strong>${c.fat||0} г</strong></div><div class="exercise">Вуглеводи<br><strong>${c.carbs||0} г</strong></div></div></div>`}
function measureHTML(d){return `<div class="card"><h2>Динаміка</h2>${d.measurements.length?d.measurements.map(x=>`<div class="exercise">${esc(x.day)} — <strong>${x.weight} кг</strong>${x.waist?' · талія '+x.waist+' см':''}</div>`).join(''):'<p class="muted">Заміри відсутні.</p>'}</div>`}
function setRows(x){let h=`<div class="setrow"><div></div><div class="sethead">Вага, кг</div><div class="sethead">Повтори</div><div class="sethead">RIR</div></div>`;for(let n=1;n<=x.sets;n++)h+=`<div class="setrow"><div class="setnum">${n}</div><input id="w${x.id}_${n}" type="number" step="0.5" placeholder="кг"><input id="r${x.id}_${n}" type="number" placeholder="${esc(x.reps)}"><input id="i${x.id}_${n}" type="number" value="${x.target_rir}" min="0" max="10"></div>`;return h}
async function clientCabinet(id){let d=await api('/client/'+id),c=d.client;let groups={};d.program.forEach(x=>(groups[x.day_name]??=[]).push(x));app.innerHTML=shell(`<div class="card"><h1>Привіт, ${esc(c.name)}</h1><p class="muted">${esc(c.goal||'Твоя програма')}</p><div class="big">${c.weight||0} кг</div></div><div class="card"><h2>Моє харчування</h2><p>${c.kcal||0} ккал · Б ${c.protein||0} · Ж ${c.fat||0} · В ${c.carbs||0}</p></div><h1>Моя програма</h1>${Object.entries(groups).length?Object.entries(groups).map(([day,xs])=>`<div class="card"><h2>${esc(day)}</h2>${xs.map(x=>`<div class="exercise"><strong>${esc(x.exercise)}</strong><div class="muted">План: ${x.sets} × ${esc(x.reps)} · цільовий RIR ${x.target_rir}</div>${setRows(x)}<br><button onclick="saveSets(${id},${x.id},'${esc(x.exercise).replace(/'/g,"&#39;")}',${x.sets})">Зберегти підходи</button></div>`).join('')}</div>`).join(''):'<div class="card muted">Тренер ще не додав програму.</div>'}`)}
async function saveSets(cid,pid,exercise,count){let sets=[];for(let n=1;n<=count;n++){let w=$(`#w${pid}_${n}`),r=$(`#r${pid}_${n}`),i=$(`#i${pid}_${n}`);if(!w.value&&!r.value)continue;if(!w.value||!r.value)return alert(`Заповни вагу та повтори у підході ${n}`);sets.push({set_number:n,weight:+w.value,reps:+r.value,rir:+i.value||0})}if(!sets.length)return alert('Заповни хоча б один підхід');await api('/result-sets',{method:'POST',body:JSON.stringify({client_id:cid,program_id:pid,exercise,sets})});alert('Підходи збережено ✓')}
route();
</script></body></html>
