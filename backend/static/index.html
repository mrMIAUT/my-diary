0px 0;min-width:0}.superset-inner+.superset-inner{border-top:1px solid var(--line);margin-top:8px;padding-top:14px}.inner-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.inner-actions button{padding:9px 12px}.tech-link{display:inline-block;margin-top:6px;color:var(--yellow);font-size:13px;font-weight:800}.move-btn{min-width:42px;padding-left:12px!important;padding-right:12px!important}@media(max-width:760px){.program-block{grid-template-columns:1fr}.program-block-actions{justify-content:flex-start}.inner-actions{justify-content:flex-start}}.program-block{position:relative!important;display:block!important;padding-right:145px!important;min-height:86px}.program-block-info{width:100%!important;max-width:100%!important;min-width:0!important}.program-block-info strong{display:inline!important;white-space:normal!important;overflow-wrap:anywhere!important;word-break:normal!important}.program-block-actions{position:absolute!important;right:14px!important;top:14px!important;display:flex!important;gap:7px!important}.superset-block{padding-right:75px!important}.superset-block .program-block-actions{right:14px!important}.superset-inner{padding-right:0!important}.inner-actions{position:static!important;display:flex!important;gap:7px!important;flex-wrap:wrap!important;margin-top:9px!important}@media(max-width:760px){.program-block,.superset-block{padding-right:14px!important}.program-block-actions{position:static!important;margin-top:12px!important;justify-content:flex-start!important}}

</style></head><body><div id="app"></div><script>
const A='/api'; const $=s=>document.querySelector(s);let session=JSON.parse(localStorage.getItem('fitSession')||'null');let selected=null;let calendarMonth=null;
async function api(path,opt={}){let r=await fetch(A+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(!r.ok){let x;try{x=await r.json()}catch{};throw new Error(x?.detail||'Помилка сервера')}return r.status===204?null:r.json()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shell(content){
 let notify=session&&session.role==="client"&&session.client_id?`<div style="display:flex;gap:8px;align-items:center"><button class="dark" onclick="showClientProfile(${session.client_id})">👤 Профіль</button><button id="clientNotifyBtn" class="dark notify-btn" onclick="showNotifications(${session.client_id},'client')">🔔 Сповіщення</button></div>`:'';
 return `<div class="wrap"><div class="top"><div class="brand">Є <span>ПЛАН</span></div>${notify}</div>${content}<div class="logout-bottom"><button class="dark" onclick="logout()">🚪 Вийти</button></div></div>`
}
function logout(){localStorage.removeItem('fitSession');session=null;renderLogin()}
function renderLogin(){
 let token=new URLSearchParams(location.search).get('reset');
 if(token)return renderResetPassword(token);
 app.innerHTML=`<div class="wrap login"><div class="brand">Є <span>ПЛАН</span></div><div class="card"><h1>Вхід</h1><input id="email" autocomplete="email" placeholder="Email"><div style="position:relative"><input id="pass" type="password" autocomplete="current-password" placeholder="Пароль" style="padding-right:52px"><button type="button" class="dark" onclick="togglePassword()" style="position:absolute;right:6px;top:13px;padding:8px 11px">👁</button></div><p id="err" class="muted"></p><button onclick="login()">Увійти</button><button class="dark" style="margin-left:8px" onclick="renderForgotPassword()">Забули пароль?</button></div></div>`
}
function renderForgotPassword(){
 app.innerHTML=`<div class="wrap login"><div class="brand">Є <span>ПЛАН</span></div><div class="card"><h1>Відновлення пароля</h1><p class="muted">Введіть справжній email, який тренер вказав під час створення акаунта.</p><input id="resetEmail" type="email" placeholder="Email"><p id="resetMsg" class="muted"></p><button onclick="requestPasswordReset()">Надіслати посилання</button><button class="dark" style="margin-left:8px" onclick="renderLogin()">Назад</button></div></div>`
}
async function requestPasswordReset(){
 try{let r=await api('/password-reset/request',{method:'POST',body:JSON.stringify({email:resetEmail.value})});resetMsg.textContent=r.message}catch(e){resetMsg.textContent=e.message}
}
function renderResetPassword(token){
 app.innerHTML=`<div class="wrap login"><div class="brand">Є <span>ПЛАН</span></div><div class="card"><h1>Новий пароль</h1><input id="newPass" type="password" autocomplete="new-password" placeholder="Новий пароль, мінімум 8 символів"><input id="newPassRepeat" type="password" autocomplete="new-password" placeholder="Повторіть новий пароль"><p id="resetMsg" class="muted"></p><button onclick="confirmPasswordReset('${esc(token)}')">Зберегти пароль</button></div></div>`
}
async function confirmPasswordReset(token){
 let p=newPass.value,r=newPassRepeat.value;
 if(p.length<8){resetMsg.textContent='Пароль має містити щонайменше 8 символів';return}
 if(p!==r){resetMsg.textContent='Паролі не співпадають';return}
 try{await api('/password-reset/confirm',{method:'POST',body:JSON.stringify({token,password:p})});localStorage.removeItem('fitSession');session=null;history.replaceState({},'',location.pathname);alert('Пароль змінено. Тепер увійдіть з новим паролем.');renderLogin()}catch(e){resetMsg.textContent=e.message}
}
function togglePassword(){let p=$('#pass');if(p)p.type=p.type==='password'?'text':'password'}
async function login(){try{let s=await api('/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});session=s;localStorage.setItem('fitSession',JSON.stringify(s));route()}catch(e){err.textContent=e.message}}
async function route(){if(!session)return renderLogin();if(session.role==='trainer')return trainerHome();return clientCabinet(session.client_id)}
async function goToTrainerHome(){
 history.pushState({eplanPage:'clients'},'',location.pathname+location.search);
 selected=null;window.currentClientData=null;
 await trainerHome();
}
async function trainerHome(){
 let cs=await api('/clients'),activeCount=cs.filter(c=>c.status==='Активний').length;
 app.innerHTML=shell(`<div class="card"><h1>Панель тренера</h1><p class="muted">Активних клієнтів: ${activeCount} · На паузі: ${cs.filter(c=>c.status==='Заморожений').length}</p><button onclick="newClient()">+ Додати клієнта</button></div><h1>Клієнти</h1>${cs.map(c=>`<div class="card client" onclick="navigateToClient(${c.id})"><div class="between"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.goal||'Без цілі')} · ${c.weight||0} кг</div></div><span class="${c.live_status==='Тренується'?'training-live':c.status==='Заморожений'?'badge status-frozen':'badge'}">${esc(c.live_status||c.status||'Активний')}</span></div></div>`).join('')}`)
}
function newClient(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="card"><div class="between"><h2>Новий клієнт</h2><button class="dark" onclick="modal.remove()">✕</button></div><p class="muted">Вкажи справжню пошту клієнта. Після створення він отримає посилання та сам встановить пароль.</p><div class="grid"><input id="n" placeholder="Ім'я"><input id="e" type="email" autocomplete="email" placeholder="Email клієнта"><input id="g" placeholder="Ціль"><input id="w" type="number" placeholder="Вага, кг"><input id="k" type="number" placeholder="Ккал"><input id="pr" type="number" placeholder="Білки"><input id="f" type="number" placeholder="Жири"><input id="ca" type="number" placeholder="Вуглеводи"></div><p id="me" class="muted"></p><button onclick="createClient()">Створити та надіслати запрошення</button></div></div>`)}
async function createClient(){
 let mail=(e.value||'').trim();
 if(!n.value.trim())return me.textContent="Вкажи ім'я клієнта";
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))return me.textContent='Вкажи коректний email';
 try{
   let r=await api('/clients',{method:'POST',body:JSON.stringify({name:n.value,email:mail,password:'',goal:g.value,weight:+w.value||0,kcal:+k.value||0,protein:+pr.value||0,fat:+f.value||0,carbs:+ca.value||0})});
   modal.remove();
   alert(r.invite_sent?'Клієнта створено. Запрошення надіслано на email.':'Клієнта створено, але лист не надіслано. Перевір налаштування пошти на Render.');
   trainerHome()
 }catch(x){me.textContent=x.message}
}
async function navigateToClient(id){
 // Only real screen changes belong to browser history. Inner tabs do not.
 history.pushState({eplanPage:'client',eplanClient:id},'',location.pathname+location.search+'#client-'+id);
 await openClient(id,'profile');
}

async function openClient(id,activeTab='profile'){
 selected=id;let d=await api('/client/'+id),c=d.client;window.currentClientData=d;

en">${commentsHTML(d,c.id)}</div><div id="cardio" class="tab hidden">${cardioHTML(d,c.id,true)}</div><div id="calendar" class="tab hidden"><div class="card"><button class="exercise-toggle" onclick="toggleCalendar('trainerCalendarBody',this)"><span><strong>Календар історії</strong><span class="muted" style="display:block;margin-top:5px">Натисни, щоб відкрити календар</span></span><span class="arrow">⌄</span></button><div id="trainerCalendarBody" class="hidden" style="margin-top:14px">${calendarHTML(d,'trainer')}</div></div></div>`);
 refreshNotificationBadge(c.id,'trainer','trainerNotifyBtn');

 if(target&&activeTab!=='profile')showTab(activeTab,target,false);

async function setClientStatus(cid,status){
 let text=status==='Заморожений'?'Заморозити клієнта? Він зможе увійти, але матиме лише перегляд історії.':'Відновити повний доступ клієнту?';
 if(!confirm(text))return;
 await api('/clients/'+cid+'/status',{method:'PATCH',body:JSON.stringify({status})});openClient(cid)
}
async function deleteClientAccount(cid){

 await api('/clients/'+cid,{method:'DELETE'});trainerHome()

async function refreshNotificationBadge(cid,recipient,buttonId){
 try{
  let xs=await api('/notifications/'+cid+'?recipient='+recipient),n=xs.filter(x=>!x.is_read).length,b=$('#'+buttonId);

  if(n)b.insertAdjacentHTML('beforeend',`<span class="notify-badge">${n>99?'99+':n}</span>`)
 }catch(e){}
}

function programHTML(d){
 let groups={}; d.program.forEach(x=>(groups[x.day_name]??=[]).push(x));
 let form=`<div class="card"><h2>Програма тренувань</h2><div class="grid"><input id="dn" placeholder="День, напр. День 1"><input id="ex" placeholder="Вправа"><input id="tech" placeholder="Посилання на техніку"><input id="st" type="number" value="3" placeholder="Підходи"><input id="rp" value="8-12" placeholder="Повтори"><input id="rr" type="number" value="2" placeholder="RIR"></div><br><button onclick="addExercise()">+ Додати вправу</button></div>`;
 let entries=Object.entries(groups);
 let list=entries.length?entries.map(([day,xs],di)=>{
   let bodyId='programDay_'+di, blocks=[];
   xs.forEach(x=>{
     if(x.superset_group){
       let b=blocks.find(v=>v.group===x.superset_group);
       if(b)b.items.push(x);else blocks.push({group:x.superset_group,items:[x]});

     let info=b.items.map((x,xi)=>`<div class="${isSuper?'superset-inner':''}"><div class="${isSuper?'superset-title-line':''}"><strong>${esc(x.exercise)}</strong>${isSuper?`<span class="badge" style="color:var(--yellow)">Суперсет</span>`:''}</div><div class="muted">${x.sets} підходи × ${esc(x.reps)} · RIR ${x.target_rir}</div>${x.technique_url?`<a href="${esc(x.technique_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="tech-link">▶ Техніка</a>`:''}<div class="inner-actions"><button class="dark" onclick="event.stopPropagation();editExercise(${x.id})">✏️ Редагувати</button><button class="danger" onclick="event.stopPropagation();deleteExercise(${x.id})">Видалити</button></div></div>`).join('');
     return `<div class="exercise program-block ${isSuper?'superset-block':''}"><div class="program-block-info">${info}</div><div class="program-block-actions">${bi>0?`<button class="dark move-btn" onclick="event.stopPropagation();moveProgramBlock('${esc(day).replace(/'/g,"&#39;")}',${bi},'up')">↑</button>`:''}${bi<blocks.length-1?`<button class="dark move-btn" onclick="event.stopPropagation();moveProgramBlock('${esc(day).replace(/'/g,"&#39;")}',${bi},'down')">↓</button>`:''}${!isSuper?`<button class="dark" title="Додати вправу в суперсет" onclick="event.stopPropagation();addSupersetExercise(${first.id},'${esc(first.day_name).replace(/'/g,"&#39;")}')">＋</button>`:''}</div></div>`;
   }).join('');
   return `<div class="card"><button class="program-day-head" onclick="toggleProgramDay('${bodyId}',this)"><h2 style="margin:0">${esc(day)}</h2><span class="program-day-arrow">⌃</span></button><div id="${bodyId}" style="margin-top:18px">${rows}</div></div>`;
 }).join(''):'<div class="card muted">Програма ще порожня.</div>';
 return form+list;
}
function toggleProgramDay(id,btn){

async function moveProgramBlock(dayName,blockIndex,direction){
 try{
   let d=window.currentClientData||{}, xs=(d.program||[]).filter(x=>x.day_name===dayName);
   let blocks=[];
   xs.forEach(x=>{
     if(x.superset_group){
       let b=blocks.find(v=>v.group===x.superset_group);
       if(b)b.ids.push(x.id);else blocks.push({group:x.superset_group,ids:[x.id]});
     }else blocks.push({group:'',ids:[x.id]});
   });
   let j=direction==='up'?blockIndex-1:blockIndex+1;
   if(j<0||j>=blocks.length)return;
   [blocks[blockIndex],blocks[j]]=[blocks[j],blocks[blockIndex]];
   let ordered_ids=blocks.flatMap(b=>b.ids);
   let cid=d.client.id;
   await api('/program/reorder',{method:'POST',body:JSON.stringify({client_id:cid,day_name:dayName,ordered_ids})});
   let byId=new Map((d.program||[]).map(x=>[x.id,x]));
   let daySet=new Set(ordered_ids), reordered=ordered_ids.map(id=>byId.get(id)).filter(Boolean), pos=0;
   d.program=(d.program||[]).map(x=>x.day_name===dayName?reordered[pos++]:x);
   window.currentClientData=d;
   let programPane=$('#program');if(programPane)programPane.innerHTML=programHTML(d);
 }catch(e){alert(e.message||'Не вдалося змінити порядок вправ')}
}

function isoToday(){let x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function monthKey(day){return day ? day.slice(0,7) : ''}
function calendarHTML(d,mode='trainer'){
 let days=[...(d.result_sets||[]).map(x=>x.day),...(d.results||[]).map(x=>x.day),...(d.nutrition||[]).map(x=>x.day),...(d.measurements||[]).map(x=>x.day),...(d.cardio||[]).map(x=>x.day)].filter(Boolean);
 let unique=[...new Set(days)];
 if(!calendarMonth) calendarMonth=(unique.sort().reverse()[0]||isoToday()).slice(0,7);
 let ym=calendarMonth,[yy,mm]=ym.split('-').map(Number);
 let first=new Date(yy,mm-1,1),count=new Date(yy,mm,0).getDate(),start=(first.getDay()+6)%7;
 let cells='';for(let i=0;i<start;i++)cells+='<button class="calendar-day empty"></button>';
 for(let n=1;n<=count;n++){let day=ym+'-'+String(n).padStart(2,'0'),has=unique.includes(day);cells+=`<button class="calendar-day ${has?'has-data':''}" data-day="${day}" onclick="showCalendarDay('${day}',this)">${n}</button>`}
 let monthNames=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
 return `<div class="card"><div class="calendar-head"><button class="dark" onclick="changeCalendarMonth(-1,'${mode}')">←</button><div style="text-align:center"><h2 style="margin-bottom:4px">${monthNames[mm-1]} ${yy}</h2><div class="muted">жовта крапка = є записи</div></div><button class="dark" onclick="changeCalendarMonth(1,'${mode}')">→</button></div><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(x=>`<div class="calendar-weekday">${x}</div>`).join('')}${cells}</div><div id="calendarDetails" class="day-details muted">Натисни на день, щоб переглянути записи.</div></div>`;
}
function toggleCalendar(id,btn){
 let el=$('#'+id);if(!el)return;
 el.classList.toggle('hidden');
 btn.classList.toggle('open');
 let a=btn.querySelector('.arrow');if(a)a.textContent=el.classList.contains('hidden')?'⌄':'⌃';
}
function changeCalendarMonth(delta,mode){
 let [y,m]=calendarMonth.split('-').map(Number),d=new Date(y,m-1+delta,1);
 calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
 let data=window.currentClientData||{};
 if(mode==='trainer'){let el=$('#trainerCalendarBody');if(el)el.innerHTML=calendarHTML(data,'trainer')}
 else {let el=$('#clientCalendar');if(el)el.innerHTML=calendarHTML(data,'client')}
}

async function saveHistoryWorkout(day,cid,name){
 let d=window.currentClientData||{},items=(d.program||[]).filter(x=>x.day_name===name),sets=[];
 for(let x of items){for(let n=1;n<=x.sets;n++){let w=$('#hw'+x.id+'_'+n),r=$('#hr'+x.id+'_'+n),i=$('#hi'+x.id+'_'+n);if(!w||(!w.value&&!r.value))continue;if(!w.value||!r.value)return alert('Заповни вагу та повтори');sets.push({program_id:x.id,exercise:x.exercise,set_number:n,weight:+w.value,reps:+r.value,rir:+i.value||0})}}
 if(!sets.length)return alert('Додай хоча б один підхід');
 await api('/history/workout',{method:'POST',body:JSON.stringify({client_id:cid,day,day_name:name,sets})});
 let nd=await api('/client/'+cid);window.currentClientData=nd;showCalendarDay(day,null)
}

function showCalendarDay(day,btn){
 let d=window.currentClientData||{};
 let sets=(d.result_sets||[]).filter(x=>x.day===day);
 let old=(d.results||[]).filter(x=>x.day===day);
 let nut=(d.nutrition||[]).filter(x=>x.day===day).sort((a,b)=>b.id-a.id);
 let sessions=(d.workout_sessions||[]).filter(x=>(x.started_at||'').slice(0,10)===day).sort((a,b)=>b.id-a.id);
 let session=sessions[0]||null;

function trainerResultDates(d,dayName){
 let program=(d.program||[]).filter(x=>x.day_name===dayName),pids=new Set(program.map(x=>x.id));
 let ss=(d.workout_sessions||[]).filter(s=>s.day_name===dayName);
 ss.forEach(s=>{if(s.program_snapshot){try{JSON.parse(s.program_snapshot).forEach(x=>pids.add(x.id))}catch(e){}}});
 let sessions=(d.workout_sessions||[]).filter(s=>s.day_name===dayName&&s.status==='finished');
 let sessionDates=sessions.map(s=>(s.started_at||'').slice(0,10)).filter(Boolean);
 let setDates=(d.result_sets||[]).filter(r=>pids.has(r.program_id)).map(r=>r.day);
 return [...new Set([...sessionDates,...setDates])].sort().reverse();
}
function periodStart(period){
 let d=new Date();
 if(period==='30')d.setDate(d.getDate()-30);
 else if(period==='90')d.setDate(d.getDate()-90);
 else if(period==='180')d.setDate(d.getDate()-180);
 else return null;
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function trainerDayResultsHTML(d,dayName){
 let baseProgram=(d.program||[]).filter(x=>x.day_name===dayName);

   return !from||day>=from;
 });
 let limit=window.trainerResultsLimit||5,shown=dates.slice(0,limit);

 if(!dates.length)return `<div class="card"><p class="muted">У вибраному періоді немає тренувань ${esc(dayName)}.</p></div>`;

 let cards=shown.map(day=>{

    ${(()=>{
      let ws=(d.workout_sessions||[]).filter(s=>s.day_name===dayName&&(s.started_at||'').slice(0,10)===day).sort((a,b)=>b.id-a.id)[0];

    })()}
    ${exercises.map(x=>{
      let cur=(d.result_sets||[]).filter(r=>r.program_id===x.id&&r.day===day).sort((a,b)=>a.set_number-b.set_number);
      let prev=previous?(d.result_sets||[]).filter(r=>r.program_id===x.id&&r.day===previous).sort((a,b)=>a.set_number-b.set_number):[];
      let bodyId=`trainerResult_${x.id}_${day.replaceAll('-','_')}`;
      return `<div class="exercise">
       <button class="exercise-toggle" onclick="toggleResultExercise('${bodyId}',this)">
        <span><strong>${esc(x.exercise)}</strong>${x.technique_url?` <a href="${esc(x.technique_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--yellow);font-size:13px">▶ Техніка</a>`:'' }${x.superset_group?`<span class="badge" style="margin-left:8px;color:var(--yellow)">Суперсет</span>`:''}<span class="muted" style="display:block;margin-top:5px">${cur.length} підходи</span></span><span class="arrow">⌄</span>
       </button>
       <div id="${bodyId}" class="hidden" style="margin-top:10px">${cur.map(s=>{
        let p=prev.find(z=>z.set_number===s.set_number);
        return `<div style="padding:8px 0;border-top:1px solid var(--line)"><div>Підхід ${s.set_number}: <strong>${s.weight} кг × ${s.reps}</strong> · RIR ${s.rir}</div>${p?`<div class="muted" style="margin-top:4px">Минулого ${p.weight} кг × ${p.reps} · різниця: вага ${resultDelta((+s.weight)-(+p.weight))} кг · повтори ${resultDelta((+s.reps)-(+p.reps))}</div>`:'<div class="muted" style="margin-top:4px">Немає попереднього результату для порівняння.</div>'}</div>`;
       }).join('')}</div>
      </div>`;
    }).join('')}
    </div>
   </div>`;
 }).join('');

 return cards+(dates.length>shown.length?`<div style="text-align:center;margin:16px 0 28px"><button class="dark" onclick="window.trainerResultsLimit=(window.trainerResultsLimit||5)+5;document.querySelector('#results').innerHTML=resultsHTML(window.currentClientData)">Показати ще (${dates.length-shown.length})</button></div>`:'');
}

async function saveSets(cid,pid,exercise,count){
 let sets=[];
 for(let n=1;n<=count;n++){
  let w=$(`#w${pid}_${n}`),r=$(`#r${pid}_${n}`),i=$(`#i${pid}_${n}`);
  if(!w.value&&!r.value)continue;
  if(!w.value||!r.value)return alert(`Заповни вагу та повтори у підході ${n}`);
  sets.push({set_number:n,weight:+w.value,reps:+r.value,rir:+i.value||0})
 }
 if(!sets.length)return alert('Заповни хоча б один підхід');
 await api('/result-sets',{method:'POST',body:JSON.stringify({client_id:cid,program_id:pid,exercise,sets})});
 let body=$('#exerciseBody'+pid);
 if(body){
   body.innerHTML=`<div class="exercise" style="margin-top:12px"><strong>Виконано ✓</strong>${sets.map(s=>`<div class="muted" style="margin-top:6px">Підхід ${s.set_number}: ${s.weight} кг × ${s.reps} · RIR ${s.rir}</div>`).join('')}<div style="margin-top:12px"><button class="dark" onclick="clientCabinet(${cid})">Редагувати</button></div></div>`;
   body.classList.add('hidden');
   let toggle=body.previousElementSibling;if(toggle)toggle.classList.remove('open');
 }
 let d=await api('/client/'+cid);window.currentClientData=d;
 let cal=$('#clientCalendar');if(cal)cal.innerHTML=calendarHTML(d,'client');
 setTimeout(()=>clientCabinet(cid),350);
}
