<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Зроби себе зі мною</title>
<style>
:root{--bg:#080909;--card:#19191c;--card2:#101012;--line:#303035;--text:#f4f4f5;--muted:#9a9aa3;--yellow:#ffd000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
.wrap{max-width:920px;margin:auto;padding:28px 20px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.brand{font-weight:900;font-size:28px}.brand span{color:var(--yellow)}h1,h2,h3{margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:22px}
.client{cursor:pointer;transition:.15s}.client:hover{border-color:#666;transform:translateY(-1px)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.between{display:flex;justify-content:space-between;gap:14px;align-items:center}
input,select{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px}
button{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--yellow);color:#080808}
button.dark{background:#29292e;color:white}button.danger{background:#402020;color:#ffb8b8}.muted{color:var(--muted)}.big{font-size:32px;font-weight:900}
.badge{background:#29292e;border-radius:999px;padding:8px 13px}.day{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}
.exercise{background:var(--card2);border:1px solid #29292e;border-radius:16px;padding:16px;margin:10px 0}.exercise strong{font-size:18px}
.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 20px}.tabs button{white-space:nowrap}.hidden{display:none!important}
.login{max-width:650px;margin:10vh auto}.login .brand{font-size:46px;margin-bottom:35px}.login input{margin:7px 0}.notice{padding:12px 14px;border-radius:12px;background:#29251a;color:#ffe8a0;margin:12px 0}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal .card{width:min(680px,100%);max-height:90vh;overflow:auto}
@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:20px 14px 90px}.brand{font-size:21px}.login .brand{font-size:38px}.card{padding:18px;border-radius:20px}.big{font-size:26px}}
</style>
</head>
<body><div id="app"></div>
<script>
const A='/api'; const $=s=>document.querySelector(s);
let session=JSON.parse(localStorage.getItem('fitSession')||'null');
let selected=null;
async function api(path,opt={}){let r=await fetch(A+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(!r.ok){let x;try{x=await r.json()}catch{};throw new Error(x?.detail||'Помилка сервера')}return r.status===204?null:r.json()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shell(content){return `<div class="wrap"><div class="top"><div class="brand">ЗРОБИ СЕБЕ <span>ЗІ МНОЮ</span></div><button class="dark" onclick="logout()">Вийти</button></div>${content}</div>`}
function logout(){localStorage.removeItem('fitSession');session=null;renderLogin()}
function renderLogin(){app.innerHTML=`<div class="wrap login"><div class="brand">ЗРОБИ СЕБЕ<br><span>ЗІ МНОЮ</span></div><div class="card"><h1>Вхід</h1><p class="muted">Кабінет тренера та клієнта</p><input id="email" value="trainer@demo.local" placeholder="Email"><input id="pass" type="password" value="trainer123" placeholder="Пароль"><p id="err" class="muted"></p><button onclick="login()">Увійти</button><p class="muted">Тренер: trainer@demo.local / trainer123<br>Клієнт: використай email і пароль, створені тренером</p></div></div>`}
async function login(){try{let s=await api('/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});session=s;localStorage.setItem('fitSession',JSON.stringify(s));route()}catch(e){err.textContent=e.message}}
async function route(){if(!session)return renderLogin(); if(session.role==='trainer')return trainerHome(); return clientCabinet(session.client_id)}
async function trainerHome(){let cs=await api('/clients');app.innerHTML=shell(`<div class="card"><h1>Панель тренера</h1><p class="muted">Активних клієнтів: ${cs.length}</p><button onclick="newClient()">+ Додати клієнта</button></div><h1>Клієнти</h1><div>${cs.map(c=>`<div class="card client" onclick="openClient(${c.id})"><div class="between"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.goal||'Без цілі')} · ${c.weight||0} кг</div></div><span class="badge">${esc(c.status||'Активний')}</span></div><p class="muted" style="margin-bottom:0">Натисни, щоб відкрити профіль і програму →</p></div>`).join('')}</div>`)}
function newClient(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="card"><div class="between"><h2>Новий клієнт</h2><button class="dark" onclick="modal.remove()">✕</button></div><div class="grid"><input id="n" placeholder="Ім'я"><input id="e" placeholder="Email"><input id="p" value="client123" placeholder="Пароль"><input id="g" placeholder="Ціль"><input id="w" type="number" placeholder="Вага, кг"><input id="k" type="number" placeholder="Ккал"><input id="pr" type="number" placeholder="Білки"><input id="f" type="number" placeholder="Жири"><input id="ca" type="number" placeholder="Вуглеводи"></div><p id="me" class="muted"></p><button onclick="createClient()">Створити клієнта</button></div></div>`)}
async function createClient(){try{await api('/clients',{method:'POST',body:JSON.stringify({name:n.value,email:e.value,password:p.value,goal:g.value,weight:+w.value||0,kcal:+k.value||0,protein:+pr.value||0,fat:+f.value||0,carbs:+ca.value||0})});modal.remove();trainerHome()}catch(x){me.textContent=x.message}}
async function openClient(id){selected=id;let d=await api('/client/'+id),c=d.client;app.innerHTML=shell(`<button class="dark" onclick="trainerHome()">← До клієнтів</button><div style="height:15px"></div><div class="card"><div class="between"><div><h1>${esc(c.name)}</h1><div class="muted">${esc(c.email)} · ${esc(c.goal||'Без цілі')}</div></div><div class="big">${c.weight||0} кг</div></div></div>
<div class="tabs"><button onclick="showTab('program')">Програма</button><button class="dark" onclick="showTab('results')">Результати</button><button class="dark" onclick="showTab('nutrition')">Харчування</button><button class="dark" onclick="showTab('progress')">Заміри</button></div>
<div id="program" class="tab">${programHTML(d)}</div><div id="results" class="tab hidden">${resultsHTML(d)}</div><div id="nutrition" class="tab hidden">${nutritionHTML(d)}</div><div id="progress" class="tab hidden">${measureHTML(d)}</div>`)}
function showTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$('#'+id).classList.remove('hidden')}
function programHTML(d){let groups={};d.program.forEach(x=>(groups[x.day_name]??=[]).push(x));return `<div class="card"><h2>Програма тренувань</h2><p class="muted">Додай вправу — вона одразу з'явиться в кабінеті клієнта.</p><div class="grid"><input id="dn" placeholder="День, напр. День 1"><input id="ex" placeholder="Вправа"><input id="st" type="number" value="3" placeholder="Підходи"><input id="rp" value="8-12" placeholder="Повтори"><input id="rr" type="number" value="2" placeholder="RIR"></div><br><button onclick="addExercise()">+ Додати вправу</button></div>${Object.entries(groups).length?Object.entries(groups).map(([day,xs])=>`<div class="card"><h2>${esc(day)}</h2>${xs.map(x=>`<div class="exercise between"><div><strong>${esc(x.exercise)}</strong><div class="muted">${x.sets} підходи × ${esc(x.reps)} · RIR ${x.target_rir}</div></div><button class="danger" onclick="deleteExercise(${x.id})">Видалити</button></div>`).join('')}</div>`).join(''):`<div class="card muted">Програма ще порожня.</div>`}`
}
async function addExercise(){if(!dn.value||!ex.value)return alert('Вкажи день і вправу');await api('/program',{method:'POST',body:JSON.stringify({client_id:selected,day_name:dn.value,exercise:ex.value,sets:+st.value||3,reps:rp.value||'8-12',target_rir:+rr.value||2})});openClient(selected)}
async function deleteExercise(id){if(confirm('Видалити вправу?')){await api('/program/'+id,{method:'DELETE'});openClient(selected)}}
function resultsHTML(d){return `<div class="card"><h2>Результати тренувань</h2>${d.results.length?d.results.map(x=>`<div class="exercise"><strong>${esc(x.exercise)}</strong><div class="muted">${esc(x.day)} · ${x.weight} кг × ${x.reps} · ${x.sets} підходи · RIR ${x.rir}</div></div>`).join(''):'<p class="muted">Клієнт ще не записував результати.</p>'}</div>`}
function nutritionHTML(d){let c=d.client;return `<div class="card"><h2>Цільове харчування</h2><div class="grid"><div class="exercise">Ккал<br><strong>${c.kcal||0}</strong></div><div class="exercise">Білки<br><strong>${c.protein||0} г</strong></div><div class="exercise">Жири<br><strong>${c.fat||0} г</strong></div><div class="exercise">Вуглеводи<br><strong>${c.carbs||0} г</strong></div></div></div><div class="card"><h2>Звіти клієнта</h2>${d.nutrition.length?d.nutrition.map(x=>`<div class="exercise">${esc(x.day)} — ${x.kcal} ккал · Б ${x.protein} · Ж ${x.fat} · В ${x.carbs}</div>`).join(''):'<p class="muted">Звітів поки немає.</p>'}</div>`}
function measureHTML(d){return `<div class="card"><h2>Динаміка</h2>${d.measurements.length?d.measurements.map(x=>`<div class="exercise">${esc(x.day)} — <strong>${x.weight} кг</strong>${x.waist?' · талія '+x.waist+' см':''}</div>`).join(''):'<p class="muted">Заміри відсутні.</p>'}</div>`}
async function clientCabinet(id){let d=await api('/client/'+id),c=d.client;let groups={};d.program.forEach(x=>(groups[x.day_name]??=[]).push(x));app.innerHTML=shell(`<div class="card"><h1>Привіт, ${esc(c.name)}</h1><p class="muted">${esc(c.goal||'Твоя програма')}</p><div class="big">${c.weight||0} кг</div></div><div class="card"><h2>Моє харчування</h2><p>${c.kcal||0} ккал · Б ${c.protein||0} · Ж ${c.fat||0} · В ${c.carbs||0}</p></div><h1>Моя програма</h1>${Object.entries(groups).length?Object.entries(groups).map(([day,xs])=>`<div class="card"><h2>${esc(day)}</h2>${xs.map(x=>`<div class="exercise"><strong>${esc(x.exercise)}</strong><div class="muted">План: ${x.sets} × ${esc(x.reps)} · RIR ${x.target_rir}</div><div class="grid" style="margin-top:12px"><input id="cw${x.id}" type="number" placeholder="Вага, кг"><input id="cr${x.id}" type="number" placeholder="Повтори"><input id="cs${x.id}" type="number" value="${x.sets}" placeholder="Підходи"><input id="ci${x.id}" type="number" value="${x.target_rir}" placeholder="RIR"></div><br><button onclick="saveResult(${id},${x.id},'${esc(x.exercise).replace(/'/g,"&#39;")}')">Зберегти результат</button></div>`).join('')}</div>`).join(''):'<div class="card muted">Тренер ще не додав програму.</div>'}`)}
async function saveResult(cid,pid,exercise){let w=$('#cw'+pid),r=$('#cr'+pid),s=$('#cs'+pid),i=$('#ci'+pid);if(!w.value||!r.value)return alert('Вкажи вагу та повтори');await api('/results',{method:'POST',body:JSON.stringify({client_id:cid,exercise,weight:+w.value,reps:+r.value,sets:+s.value,rir:+i.value})});alert('Результат збережено ✓')}
route();
</script></body></html>
