<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Зроби себе зі мною</title><style>
:root{--bg:#080909;--card:#19191c;--card2:#101012;--line:#303035;--text:#f4f4f5;--muted:#9a9aa3;--yellow:#ffd000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:28px 20px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-weight:900;font-size:28px}.brand span{color:var(--yellow)}h1,h2,h3{margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:22px}.client{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.between{display:flex;justify-content:space-between;gap:14px;align-items:center}input{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px}button{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--yellow);color:#080808}button.dark{background:#29292e;color:white}button.danger{background:#402020;color:#ffb8b8}.muted{color:var(--muted)}.big{font-size:32px;font-weight:900}.badge{background:#29292e;border-radius:999px;padding:8px 13px}.exercise{background:var(--card2);border:1px solid #29292e;border-radius:16px;padding:16px;margin:10px 0}.exercise strong{font-size:18px}.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 20px}.tabs button{white-space:nowrap}.hidden{display:none!important}.login{max-width:650px;margin:10vh auto}.login .brand{font-size:46px;margin-bottom:35px}.login input{margin:7px 0}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal .card{width:min(680px,100%);max-height:90vh;overflow:auto}.setrow{display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:10px;align-items:center;margin-top:10px}.setnum{font-weight:900;text-align:center}.sethead{font-size:12px;color:var(--muted);text-align:center}
.exercise-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:transparent;color:var(--text);padding:0;border-radius:0}
.exercise-toggle:hover{opacity:.9}.exercise-toggle .arrow{font-size:18px;transition:.15s}.exercise-toggle.open .arrow{transform:rotate(180deg)}
.exercise-body{margin-top:12px}.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.calendar-weekday{text-align:center;color:var(--muted);font-size:12px;padding:5px}
.calendar-day{min-height:48px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:8px 4px;text-align:center;position:relative}
.calendar-day.empty{visibility:hidden}.calendar-day.has-data{border-color:#756200}.calendar-day.has-data:after{content:'';width:6px;height:6px;border-radius:50%;background:var(--yellow);position:absolute;bottom:5px;left:50%;transform:translateX(-50%)}
.calendar-day.active{background:var(--yellow);color:#080808}.training-live{display:inline-flex;align-items:center;gap:7px;color:#6ee787;font-weight:900}.training-live:before{content:'';width:9px;height:9px;border-radius:50%;background:#39d353;box-shadow:0 0 12px #39d353}.preview-selected{outline:2px solid var(--yellow)}.calendar-day.active:after{background:#080808}.day-details{margin-top:16px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:20px 14px 90px}.brand{font-size:21px}.login .brand{font-size:38px}.card{padding:18px;border-radius:20px}.setrow{grid-template-columns:52px 1fr 1fr 1fr;gap:6px}.setrow input{padding:11px 7px;font-size:14px}}
</style></head><body><div id="app"></div><script>
const A='/api'; const $=s=>document.querySelector(s);let session=JSON.parse(localStorage.getItem('fitSession')||'null');let selected=null;let calendarMonth=null;
async function api(path,opt={}){let r=await fetch(A+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(!r.ok){let x;try{x=await r.json()}catch{};throw new Error(x?.detail||'Помилка сервера')}return r.status===204?null:r.json()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shell(content){return `<div class="wrap"><div class="top"><div class="brand">ЗРОБИ СЕБЕ <span>ЗІ МНОЮ</span></div><button class="dark" onclick="logout()">Вийти</button></div>${content}</div>`}
function logout(){localStorage.removeItem('fitSession');session=null;renderLogin()}
function renderLogin(){app.innerHTML=`<div class="wrap login"><div class="brand">ЗРОБИ СЕБЕ<br><span>ЗІ МНОЮ</span></div><div class="card"><h1>Вхід</h1><input id="email" value="trainer@demo.local" placeholder="Email"><div style="position:relative"><input id="pass" type="password" value="trainer123" placeholder="Пароль" style="padding-right:52px"><button type="button" class="dark" onclick="togglePassword()" style="position:absolute;right:6px;top:13px;padding:8px 11px">👁</button></div><p id="err" class="muted"></p><button onclick="login()">Увійти</button><p class="muted">Тренер: trainer@demo.local / trainer123<br>Клієнт: використай email і пароль, створені тренером</p></div></div>`}
function togglePassword(){let p=$('#pass');if(p)p.type=p.type==='password'?'text':'password'}
async function login(){try{let s=await api('/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});session=s;localStorage.setItem('fitSession',JSON.stringify(s));route()}catch(e){err.textContent=e.message}}
async function route(){if(!session)return renderLogin();if(session.role==='trainer')return trainerHome();return clientCabinet(session.client_id)}
async function trainerHome(){let cs=await api('/clients');app.innerHTML=shell(`<div class="card"><h1>Панель тренера</h1><p class="muted">Активних клієнтів: ${cs.length}</p><button onclick="newClient()">+ Додати клієнта</button></div><h1>Клієнти</h1>${cs.map(c=>`<div class="card client" onclick="openClient(${c.id})"><div class="between"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.goal||'Без цілі')} · ${c.weight||0} кг</div></div><span class="${c.live_status==='Тренується'?'training-live':'badge'}">${esc(c.live_status||c.status||'Активний')}</span></div></div>`).join('')}`)}
function newClient(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="card"><div class="between"><h2>Новий клієнт</h2><button class="dark" onclick="modal.remove()">✕</button></div><div class="grid"><input id="n" placeholder="Ім'я"><input id="e" placeholder="Email"><input id="p" value="client123" placeholder="Пароль"><input id="g" placeholder="Ціль"><input id="w" type="number" placeholder="Вага, кг"><input id="k" type="number" placeholder="Ккал"><input id="pr" type="number" placeholder="Білки"><input id="f" type="number" placeholder="Жири"><input id="ca" type="number" placeholder="Вуглеводи"></div><p id="me" class="muted"></p><button onclick="createClient()">Створити клієнта</button></div></div>`)}
async function createClient(){try{await api('/clients',{method:'POST',body:JSON.stringify({name:n.value,email:e.value,password:p.value,goal:g.value,weight:+w.value||0,kcal:+k.value||0,protein:+pr.value||0,fat:+f.value||0,carbs:+ca.value||0})});modal.remove();trainerHome()}catch(x){me.textContent=x.message}}
async function openClient(id){selected=id;let d=await api('/client/'+id),c=d.client;window.currentClientData=d;app.innerHTML=shell(`<button class="dark" onclick="trainerHome()">← До клієнтів</button><div style="height:15px"></div><div class="card"><div class="between"><div><h1>${esc(c.name)}</h1><div class="muted">${esc(c.email)} · ${esc(c.goal||'Без цілі')}</div></div><div class="big">${c.weight||0} кг</div></div></div><div class="tabs"><button onclick="showTab('program',this)">Програма</button><button class="dark" onclick="showTab('results',this)">Результати</button><button class="dark" onclick="showTab('nutrition',this)">Харчування</button><button class="dark" onclick="showTab('progress',this)">Заміри</button><button class="dark" onclick="showTab('calendar',this)">Календар</button></div><div id="program" class="tab">${programHTML(d)}</div><div id="results" class="tab hidden">${resultsHTML(d)}</div><div id="nutrition" class="tab hidden">${nutritionHTML(d)}</div><div id="progress" class="tab hidden">${measureHTML(d)}</div><div id="calendar" class="tab hidden"><div class="card"><button class="exercise-toggle" onclick="toggleCalendar('trainerCalendarBody',this)"><span><strong>Календар історії</strong><span class="muted" style="display:block;margin-top:5px">Натисни, щоб відкрити календар</span></span><span class="arrow">⌄</span></button><div id="trainerCalendarBody" class="hidden" style="margin-top:14px">${calendarHTML(d,'trainer')}</div></div></div>`)}
function showTab(id,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$('#'+id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.add('dark'));btn.classList.remove('dark')}
function programHTML(d){
 let groups={}; d.program.forEach(x=>(groups[x.day_name]??=[]).push(x));
 let form=`<div class="card"><h2>Програма тренувань</h2><div class="grid"><input id="dn" placeholder="День, напр. День 1"><input id="ex" placeholder="Вправа"><input id="st" type="number" value="3" placeholder="Підходи"><input id="rp" value="8-12" placeholder="Повтори"><input id="rr" type="number" value="2" placeholder="RIR"></div><br><button onclick="addExercise()">+ Додати вправу</button></div>`;
 let list=Object.entries(groups).length ? Object.entries(groups).map(([day,xs])=>`<div class="card"><h2>${esc(day)}</h2>${xs.map(x=>`<div class="exercise between"><div><strong>${esc(x.exercise)}</strong><div class="muted">${x.sets} підходи × ${esc(x.reps)} · RIR ${x.target_rir}</div></div><button class="danger" onclick="deleteExercise(${x.id})">Видалити</button></div>`).join('')}</div>`).join('') : '<div class="card muted">Програма ще порожня.</div>';
 return form+list;
}
async function addExercise(){if(!dn.value||!ex.value)return alert('Вкажи день і вправу');await api('/program',{method:'POST',body:JSON.stringify({client_id:selected,day_name:dn.value,exercise:ex.value,sets:+st.value||3,reps:rp.value||'8-12',target_rir:+rr.value||2})});openClient(selected)}
async function deleteExercise(id){if(confirm('Видалити вправу?')){await api('/program/'+id,{method:'DELETE'});openClient(selected)}}

function toggleExercise(id,btn){let b=$('#'+id);if(!b)return;b.classList.toggle('hidden');btn.classList.toggle('open')}
function isoToday(){let x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function monthKey(day){return day ? day.slice(0,7) : ''}
function calendarHTML(d,mode='trainer'){
 let days=[...(d.result_sets||[]).map(x=>x.day),...(d.results||[]).map(x=>x.day),...(d.nutrition||[]).map(x=>x.day),...(d.measurements||[]).map(x=>x.day)].filter(Boolean);
 let unique=[...new Set(days)];
 if(!calendarMonth) calendarMonth=(unique.sort().reverse()[0]||isoToday()).slice(0,7);
 let ym=calendarMonth,[yy,mm]=ym.split('-').map(Number);
 let first=new Date(yy,mm-1,1),count=new Date(yy,mm,0).getDate(),start=(first.getDay()+6)%7;
 let cells='';for(let i=0;i<start;i++)cells+='<button class="calendar-day empty"></button>';
 for(let n=1;n<=count;n++){let day=ym+'-'+String(n).padStart(2,'0'),has=unique.includes(day);cells+=`<button class="calendar-day ${has?'has-data':''}" data-day="${day}" onclick="showCalendarDay('${day}',this)">${n}</button>`}
 let monthNames=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
 return `<div class="card"><div class="calendar-head"><button class="dark" onclick="changeCalendarMonth(-1,'${mode}')">←</button><div style="text-align:center"><h2 style="margin-bottom:4px">${monthNames[mm-1]} ${yy}</h2><div class="muted">жовта крапка = є записи</div></div><button class="dark" onclick="changeCalendarMonth(1,'${mode}')">→</button></div><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(x=>`<div class="calendar-weekday">${x}</div>`).join('')}${cells}</div><div id="calendarDetails" class="day-details muted">Натисни на день, щоб переглянути записи.</div></div>`;
}
function toggleCalendar(id,btn){
 let el=$('#'+id);if(!el)return;
 el.classList.toggle('hidden');
 btn.classList.toggle('open');
 let a=btn.querySelector('.arrow');if(a)a.textContent=el.classList.contains('hidden')?'⌄':'⌃';
}
function changeCalendarMonth(delta,mode){
 let [y,m]=calendarMonth.split('-').map(Number),d=new Date(y,m-1+delta,1);
 calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
 let data=window.currentClientData||{};
 if(mode==='trainer'){let el=$('#trainerCalendarBody');if(el)el.innerHTML=calendarHTML(data,'trainer')}
 else {let el=$('#clientCalendar');if(el)el.innerHTML=calendarHTML(data,'client')}
}
function showCalendarDay(day,btn){
 document.querySelectorAll('.calendar-day').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
 let d=window.currentClientData||{}, sets=(d.result_sets||[]).filter(x=>x.day===day), old=(d.results||[]).filter(x=>x.day===day), nut=(d.nutrition||[]).filter(x=>x.day===day), meas=(d.measurements||[]).filter(x=>x.day===day);
 let by={};sets.forEach(x=>{let k=x.program_id+'|'+x.exercise;(by[k]??=[]).push(x)});
 let workouts=Object.values(by).map(xs=>{xs.sort((a,b)=>a.set_number-b.set_number);return `<div class="exercise"><strong>${esc(xs[0].exercise)}</strong>${xs.map(s=>`<div class="muted" style="margin-top:6px">Підхід ${s.set_number}: ${s.weight} кг × ${s.reps} · RIR ${s.rir}</div>`).join('')}</div>`}).join('');
 workouts+=old.map(x=>`<div class="exercise"><strong>${esc(x.exercise)}</strong><div class="muted">${x.weight} кг × ${x.reps} · ${x.sets} підходи · RIR ${x.rir}</div></div>`).join('');
 let extra=nut.map(x=>`<div class="exercise">Харчування: ${x.kcal} ккал · Б ${x.protein} · Ж ${x.fat} · В ${x.carbs}</div>`).join('')+meas.map(x=>`<div class="exercise">Заміри: ${x.weight} кг${x.waist?' · талія '+x.waist+' см':''}</div>`).join('');
 $('#calendarDetails').innerHTML=`<h3>${esc(day)}</h3>`+(workouts||extra?workouts+extra:'<p class="muted">На цей день записів немає.</p>');
}

function resultsHTML(d){
 let detailed=d.result_sets||[],by={};
 detailed.forEach(x=>{let k=x.day+'|'+x.program_id+'|'+x.exercise;(by[k]??=[]).push(x)});
 let detailHTML=Object.values(by).map(xs=>{
   xs.sort((a,b)=>a.set_number-b.set_number);
   let setLines=xs.map(s=>'<div style="margin-top:7px">Підхід '+s.set_number+': <strong>'+s.weight+' кг × '+s.reps+'</strong> · RIR '+s.rir+'</div>').join('');
   return '<div class="exercise"><strong>'+esc(xs[0].exercise)+'</strong><div class="muted">'+esc(xs[0].day)+'</div>'+setLines+'</div>';
 }).join('');
 let oldHTML=(d.results||[]).map(x=>'<div class="exercise"><strong>'+esc(x.exercise)+'</strong><div class="muted">'+esc(x.day)+' · '+x.weight+' кг × '+x.reps+' · '+x.sets+' підходи · RIR '+x.rir+'</div></div>').join('');
 let content=detailHTML||oldHTML||'<p class="muted">Клієнт ще не записував результати.</p>';
 return '<div class="card"><h2>Історія тренувань</h2><p class="muted">Кожен підхід зберігається окремо: вага, повтори та RIR.</p>'+content+'</div>';
}
function nutritionHTML(d){let c=d.client;return `<div class="card"><h2>Цільове харчування</h2><p class="muted">Зміни калорійність та БЖВ клієнта. Після збереження нові цілі одразу з'являться в його кабінеті.</p><div class="grid"><div><div class="muted">Ккал</div><input id="nkcal" type="number" value="${c.kcal||0}"></div><div><div class="muted">Білки, г</div><input id="nprotein" type="number" value="${c.protein||0}"></div><div><div class="muted">Жири, г</div><input id="nfat" type="number" value="${c.fat||0}"></div><div><div class="muted">Вуглеводи, г</div><input id="ncarbs" type="number" value="${c.carbs||0}"></div></div><br><button onclick="saveNutritionTargets(${c.id})">Зберегти харчування</button><span id="nutritionSaved" class="muted" style="margin-left:12px"></span></div>`}
async function saveNutritionTargets(cid){let body={kcal:+nkcal.value||0,protein:+nprotein.value||0,fat:+nfat.value||0,carbs:+ncarbs.value||0};await api('/client/'+cid+'/nutrition',{method:'PATCH',body:JSON.stringify(body)});let s=$('#nutritionSaved');if(s)s.textContent='Збережено ✓';let d=await api('/client/'+cid);window.currentClientData=d}
function measureHTML(d){return `<div class="card"><h2>Динаміка</h2>${d.measurements.length?d.measurements.map(x=>`<div class="exercise">${esc(x.day)} — <strong>${x.weight} кг</strong>${x.waist?' · талія '+x.waist+' см':''}</div>`).join(''):'<p class="muted">Заміри відсутні.</p>'}</div>`}

function todaySets(d,pid){return (d.result_sets||[]).filter(x=>x.program_id===pid&&x.day===isoToday()).sort((a,b)=>a.set_number-b.set_number)}
function completedExerciseHTML(x,d,cid){
 let done=todaySets(d,x.id);
 if(!done.length)return setRows(x,d)+`<br><button onclick="saveSets(${cid},${x.id},'${esc(x.exercise).replace(/'/g,"&#39;")}',${x.sets})">Закінчити вправу</button>`;
 return `<div class="exercise" style="margin-top:12px"><strong style="color:var(--yellow)">Виконано ✓</strong>${done.map(s=>`<div class="muted" style="margin-top:6px">Підхід ${s.set_number}: ${s.weight} кг × ${s.reps} · RIR ${s.rir}</div>`).join('')}<div style="margin-top:12px"><button class="dark" onclick="editCompletedExercise(${cid},${x.id},'${esc(x.exercise).replace(/'/g,"&#39;")}',${x.sets},'${esc(x.reps)}',${x.target_rir})">Редагувати</button></div></div>`;
}
function editCompletedExercise(cid,pid,exercise,count,reps,targetRir){
 let d=window.currentClientData||{},done=todaySets(d,pid),body=$('#exerciseBody'+pid);if(!body)return;
 let h=`<div class="setrow"><div></div><div class="sethead">Вага, кг</div><div class="sethead">Повтори</div><div class="sethead">RIR</div></div>`;
 for(let n=1;n<=count;n++){let s=done.find(z=>z.set_number===n)||{};h+=`<div class="setrow"><div class="setnum">${n}</div><input id="w${pid}_${n}" type="number" step="0.5" value="${s.weight??''}" placeholder="кг"><input id="r${pid}_${n}" type="number" value="${s.reps??''}" placeholder="${esc(reps)}"><input id="i${pid}_${n}" type="number" value="${s.rir??targetRir}" min="0" max="10"></div>`}
 body.innerHTML=h+`<br><button onclick="saveSets(${cid},${pid},'${exercise.replace(/'/g,"&#39;")}',${count})">Зберегти зміни</button>`;
 body.classList.remove('hidden');
}

function previousSets(d,pid){
 let all=(d.result_sets||[]).filter(x=>x.program_id===pid);
 if(!all.length)return '';
 let latest=all.map(x=>x.day).sort().reverse()[0];
 let xs=all.filter(x=>x.day===latest).sort((a,b)=>a.set_number-b.set_number);
 return `<div class="exercise" style="margin-top:12px"><div class="muted">Попереднє тренування · ${esc(latest)}</div>${xs.map(s=>`<div style="margin-top:6px">Підхід ${s.set_number}: <strong>${s.weight} кг × ${s.reps}</strong> · RIR ${s.rir}</div>`).join('')}</div>`;
}
function setRows(x,d){let h=`<div class="setrow"><div></div><div class="sethead">Вага, кг</div><div class="sethead">Повтори</div><div class="sethead">RIR</div></div>`;for(let n=1;n<=x.sets;n++)h+=`<div class="setrow"><div class="setnum">${n}</div><input id="w${x.id}_${n}" type="number" step="0.5" placeholder="кг"><input id="r${x.id}_${n}" type="number" placeholder="${esc(x.reps)}"><input id="i${x.id}_${n}" type="number" value="${x.target_rir}" min="0" max="10"></div>`;return previousSets(d,x.id)+h}

async function addDailyNutrition(cid,nid=null){
 let k=+$('#dkcal').value||0,p=+$('#dprotein').value||0,f=+$('#dfat').value||0,c=+$('#dcarbs').value||0;
 if(!k&&!p&&!f&&!c)return alert('Вкажи дані харчування');
 if(nid) await api('/nutrition/'+nid,{method:'PATCH',body:JSON.stringify({client_id:cid,kcal:k,protein:p,fat:f,carbs:c})});
 else await api('/nutrition',{method:'POST',body:JSON.stringify({client_id:cid,kcal:k,protein:p,fat:f,carbs:c})});
 clientCabinet(cid)
}
function editDailyNutrition(cid,nid){
 let d=window.currentClientData||{},x=(d.nutrition||[]).find(z=>z.id===nid);if(!x)return;
 let box=$('#dailyNutritionBox');if(!box)return;
 box.innerHTML=`<h2>Редагувати БЖВ</h2><div class="grid"><input id="dkcal" type="number" value="${x.kcal||0}" placeholder="Ккал"><input id="dprotein" type="number" value="${x.protein||0}" placeholder="Білки, г"><input id="dfat" type="number" value="${x.fat||0}" placeholder="Жири, г"><input id="dcarbs" type="number" value="${x.carbs||0}" placeholder="Вуглеводи, г"></div><br><button onclick="addDailyNutrition(${cid},${nid})">Зберегти зміни</button>`;
}
function dailyNutritionHTML(d,cid){
 let today=(d.nutrition||[]).filter(x=>x.day===isoToday()).sort((a,b)=>b.id-a.id),x=today[0];
 if(x)return `<div class="card" id="dailyNutritionBox"><div class="between"><div><h2>БЖВ за сьогодні</h2><div class="muted">${x.kcal} ккал · Б ${x.protein} · Ж ${x.fat} · В ${x.carbs}</div></div><button class="dark" onclick="editDailyNutrition(${cid},${x.id})">Редагувати</button></div></div>`;
 return `<div class="card" id="dailyNutritionBox"><h2>БЖВ за сьогодні</h2><div class="grid"><input id="dkcal" type="number" placeholder="Ккал"><input id="dprotein" type="number" placeholder="Білки, г"><input id="dfat" type="number" placeholder="Жири, г"><input id="dcarbs" type="number" placeholder="Вуглеводи, г"></div><br><button onclick="addDailyNutrition(${cid})">Зберегти БЖВ</button></div>`;
}
let previewWorkoutDay=null;
function previewWorkout(day,cid){
 previewWorkoutDay=previewWorkoutDay===day?null:day;
 clientCabinet(cid)
}
async function startWorkout(cid,day){
 let s=await api('/workout/start',{method:'POST',body:JSON.stringify({client_id:cid,day_name:day})});
 localStorage.setItem('activeWorkout_'+cid,JSON.stringify(s));clientCabinet(cid)
}
async function finishWorkout(cid,sid){
 if(!confirm('Завершити тренування?'))return;
 await api('/workout/'+sid+'/finish',{method:'POST'});
 localStorage.removeItem('activeWorkout_'+cid);previewWorkoutDay=null;clientCabinet(cid)
}
function workoutChooser(d,cid,groups){
 let active=(d.workout_sessions||[]).find(x=>x.status==='training');
 if(active)return `<div class="card"><div class="between"><div><div class="training-live">Тренування триває</div><h2 style="margin-top:8px">${esc(active.day_name)}</h2></div><button onclick="finishWorkout(${cid},${active.id})">Завершити тренування</button></div></div>`;
 return `<div class="card"><h2>Тренування</h2><p class="muted">Обери день, щоб просто переглянути вправи. Тренування почнеться лише після натискання «Почати тренування».</p><div style="display:flex;gap:8px;flex-wrap:wrap">${Object.keys(groups).map(day=>`<button class="${previewWorkoutDay===day?'preview-selected':'dark'}" onclick="previewWorkout('${esc(day).replace(/'/g,"&#39;")}',${cid})">${esc(day)}</button>`).join('')}</div>${previewWorkoutDay?`<div class="exercise" style="margin-top:16px"><div class="between"><div><div class="muted">Перегляд</div><strong>${esc(previewWorkoutDay)}</strong></div><button onclick="startWorkout(${cid},'${esc(previewWorkoutDay).replace(/'/g,"&#39;")}')">Почати тренування</button></div></div>`:''}</div>`;
}
async function clientCabinet(id){
 let d=await api('/client/'+id),c=d.client;window.currentClientData=d;let groups={};d.program.forEach(x=>(groups[x.day_name]??=[]).push(x));
 let active=(d.workout_sessions||[]).find(x=>x.status==='training');
 if(active) previewWorkoutDay=active.day_name;
 let chosen=active?active.day_name:previewWorkoutDay;
 let programPart='';
 if(active){
   programPart=`<h1>${esc(active.day_name)}</h1><div class="card"><div class="training-live">Тренування триває</div><div style="height:12px"></div>${(groups[active.day_name]||[]).map(x=>`<div class="exercise"><button class="exercise-toggle" onclick="toggleExercise('exerciseBody${x.id}',this)"><span><strong>${esc(x.exercise)}</strong>${(d.result_sets||[]).some(r=>r.program_id===x.id&&r.day===isoToday())?'<span style="color:var(--yellow);font-weight:800;margin-left:8px">Виконано ✓</span>':''}<span class="muted" style="display:block;margin-top:5px">План: ${x.sets} × ${esc(x.reps)} · RIR ${x.target_rir}</span></span><span class="arrow">⌄</span></button><div id="exerciseBody${x.id}" class="exercise-body hidden">${completedExerciseHTML(x,d,id)}</div></div>`).join('')}</div>`;
 }else if(chosen){
   programPart=`<h1>Перегляд: ${esc(chosen)}</h1><div class="card">${(groups[chosen]||[]).map(x=>`<div class="exercise"><strong>${esc(x.exercise)}</strong><div class="muted">План: ${x.sets} × ${esc(x.reps)} · RIR ${x.target_rir}</div></div>`).join('')}</div>`;
 }else programPart='<div class="card muted">Обери тренування вище, щоб переглянути вправи.</div>';
 app.innerHTML=shell(`<div class="card"><h1>Привіт, ${esc(c.name)}</h1><p class="muted">${esc(c.goal||'Твоя програма')}</p><div class="big">${c.weight||0} кг</div></div><div class="card"><h2>Моє харчування</h2><p>${c.kcal||0} ккал · Б ${c.protein||0} · Ж ${c.fat||0} · В ${c.carbs||0}</p></div>${dailyNutritionHTML(d,id)}${workoutChooser(d,id,groups)}${programPart}<div class="card" style="margin-top:28px"><button class="exercise-toggle" onclick="toggleCalendar('clientCalendarBody',this)"><span><strong>Моя історія</strong><span class="muted" style="display:block;margin-top:5px">Календар тренувань, харчування та замірів</span></span><span class="arrow">⌄</span></button><div id="clientCalendarBody" class="hidden" style="margin-top:14px"><div id="clientCalendar">${calendarHTML(d,'client')}</div></div></div>`)
}
async function saveSets(cid,pid,exercise,count){
 let sets=[];
 for(let n=1;n<=count;n++){
  let w=$(`#w${pid}_${n}`),r=$(`#r${pid}_${n}`),i=$(`#i${pid}_${n}`);
  if(!w.value&&!r.value)continue;
  if(!w.value||!r.value)return alert(`Заповни вагу та повтори у підході ${n}`);
  sets.push({set_number:n,weight:+w.value,reps:+r.value,rir:+i.value||0})
 }
 if(!sets.length)return alert('Заповни хоча б один підхід');
 await api('/result-sets',{method:'POST',body:JSON.stringify({client_id:cid,program_id:pid,exercise,sets})});
 let body=$('#exerciseBody'+pid);
 if(body){
   body.innerHTML=`<div class="exercise" style="margin-top:12px"><strong>Виконано ✓</strong>${sets.map(s=>`<div class="muted" style="margin-top:6px">Підхід ${s.set_number}: ${s.weight} кг × ${s.reps} · RIR ${s.rir}</div>`).join('')}<div style="margin-top:12px"><button class="dark" onclick="clientCabinet(${cid})">Редагувати</button></div></div>`;
   body.classList.add('hidden');
   let toggle=body.previousElementSibling;if(toggle)toggle.classList.remove('open');
 }
 let d=await api('/client/'+cid);window.currentClientData=d;
 let cal=$('#clientCalendar');if(cal)cal.innerHTML=calendarHTML(d,'client');
 setTimeout(()=>clientCabinet(cid),350);
}
route();
</script></body></html>
