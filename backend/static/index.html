<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Зроби себе зі мною</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#f5f5f5;font-family:Arial,sans-serif}button,input{font:inherit}
.wrap{max-width:850px;margin:auto;padding:28px 24px 110px}.brand{font-weight:900;font-size:30px}.y{color:#ffd000}
.card{background:#18181b;border:1px solid #34343a;border-radius:28px;padding:28px;margin:22px 0}.muted{color:#9b9ba3}
input{width:100%;padding:17px;border-radius:16px;border:1px solid #38383f;background:#101012;color:white;margin:7px 0}
.btn{border:0;border-radius:16px;padding:15px 22px;font-weight:800;background:#ffd000;color:#090909;cursor:pointer}.ghost{background:#28282d;color:white}
.top{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.client{display:flex;justify-content:space-between;align-items:center;gap:12px}.client b{font-size:22px}.pill{background:#29292e;padding:10px 15px;border-radius:999px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#101012;border-top:1px solid #29292d;display:flex;justify-content:center;gap:30px;padding:17px;z-index:4}
.bottom button{background:none;border:0;color:#aaa;font-weight:800}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:10}
.sheet{background:#18181b;border:1px solid #38383f;border-radius:28px 28px 0 0;width:min(850px,100%);margin:auto;padding:24px;max-height:92vh;overflow:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.error{color:#ff7373}.success{color:#69dc8a}
@media(max-width:600px){.wrap{padding:24px 20px 105px}.brand{font-size:25px}.card{padding:22px}.grid,.row{grid-template-columns:1fr}.client b{font-size:20px}}
</style></head>
<body>
<div class="wrap">
 <div id="loginScreen">
  <div class="brand" style="font-size:48px;margin-top:90px">ЗРОБИ СЕБЕ<br><span class="y">ЗІ МНОЮ</span></div>
  <div class="card"><h1>Вхід</h1><p class="muted">Кабінет тренера та клієнта</p>
   <input id="email" value="trainer@demo.local" placeholder="Email"><input id="password" type="password" value="trainer123" placeholder="Пароль">
   <p><button class="btn" onclick="doLogin()">Увійти</button></p><div id="loginErr" class="error"></div>
   <p class="muted">Тренер: trainer@demo.local / trainer123<br>Клієнт: anna@demo.local / client123</p>
  </div>
 </div>
 <div id="app" style="display:none">
  <div class="top"><div class="brand">ЗРОБИ СЕБЕ <span class="y">ЗІ МНОЮ</span></div><button class="btn ghost" onclick="doLogout()">Вийти</button></div>
  <div id="main"></div>
 </div>
</div>
<div id="nav" class="bottom" style="display:none"><button onclick="home()">Головна</button><button onclick="clientsPage()">Клієнти</button><button onclick="nutritionPage()">Харчування</button></div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">
 <div class="top"><h2>Новий клієнт</h2><button class="btn ghost" onclick="closeModal()">✕</button></div>
 <p class="muted">Створи клієнту обліковий запис і одразу задай стартові дані.</p>
 <input id="nName" placeholder="Ім'я та прізвище">
 <div class="row"><input id="nEmail" type="email" placeholder="Email"><input id="nPass" value="client123" placeholder="Пароль"></div>
 <input id="nGoal" placeholder="Ціль, напр. Рекомпозиція">
 <div class="row"><input id="nWeight" type="number" step=".1" placeholder="Вага, кг"><input id="nKcal" type="number" placeholder="Ккал"></div>
 <div class="row"><input id="nP" type="number" placeholder="Білки, г"><input id="nF" type="number" placeholder="Жири, г"></div>
 <input id="nC" type="number" placeholder="Вуглеводи, г">
 <div id="formMsg"></div><p><button class="btn" onclick="createClient()">Створити клієнта</button></p>
</div></div>

<script>
let role="",clientId=null,clients=[];
async function api(path,opt={}){let r=await fetch(path,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
async function doLogin(){
 document.getElementById("loginErr").textContent="";
 try{let x=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})});
 role=x.role;clientId=x.client_id;sessionStorage.setItem("session",JSON.stringify(x));showApp();
 }catch(e){document.getElementById("loginErr").textContent="Невірний email або пароль"}
}
function doLogout(){sessionStorage.removeItem("session");location.reload()}
async function showApp(){document.getElementById("loginScreen").style.display="none";document.getElementById("app").style.display="block";document.getElementById("nav").style.display="flex";await home()}
async function home(){
 if(role==="trainer"){clients=await api("/api/clients");main.innerHTML=`<div class="card"><h1>Панель тренера</h1><p class="muted">Активних клієнтів: ${clients.length}</p><button class="btn" onclick="openModal()">＋ Додати клієнта</button></div><h1>Клієнти</h1>`+clientCards(clients)}
 else {let d=await api("/api/client/"+clientId);main.innerHTML=`<div class="card"><h1>${d.client.name}</h1><p class="muted">${d.client.goal||""} · ${d.client.weight||0} кг</p><b>${d.client.kcal||0} ккал · Б ${d.client.protein||0} · Ж ${d.client.fat||0} · В ${d.client.carbs||0}</b></div><h2>Моя програма</h2>`+d.program.map(x=>`<div class="card"><b>${x.day_name}: ${x.exercise}</b><p>${x.sets} × ${x.reps} · RIR ${x.target_rir}</p></div>`).join("")}
}
function clientCards(a){return a.map(x=>`<div class="card client"><div><b>${x.name}</b><p class="muted">${x.goal||"Без цілі"} · ${x.weight||0} кг</p></div><span class="pill">${x.status||"Активний"}</span></div>`).join("")}
async function clientsPage(){if(role!=="trainer"){home();return}clients=await api("/api/clients");main.innerHTML=`<div class="top"><h1>Клієнти</h1><button class="btn" onclick="openModal()">＋ Додати</button></div>`+clientCards(clients)}
async function nutritionPage(){
 let cid=role==="client"?clientId:(clients[0]&&clients[0].id); if(!cid){main.innerHTML="<h1>Харчування</h1><p>Немає клієнтів.</p>";return}
 let d=await api("/api/client/"+cid);main.innerHTML=`<h1>Харчування</h1><p class="muted">${d.client.name}</p>`+(d.nutrition.length?d.nutrition.map(n=>`<div class="card"><b>${n.day}</b><p>${n.kcal} ккал · Б ${n.protein} · Ж ${n.fat} · В ${n.carbs}</p></div>`).join(""):"<div class='card muted'>Записів поки немає</div>")
}
function openModal(){formMsg.textContent="";modal.style.display="flex"} function closeModal(){modal.style.display="none"}
async function createClient(){
 formMsg.className="";formMsg.textContent="";
 if(!nName.value.trim()||!nEmail.value.trim()){formMsg.className="error";formMsg.textContent="Вкажи ім'я та email.";return}
 let data={name:nName.value.trim(),email:nEmail.value.trim(),password:nPass.value||"client123",goal:nGoal.value.trim(),weight:+nWeight.value||0,kcal:+nKcal.value||0,protein:+nP.value||0,fat:+nF.value||0,carbs:+nC.value||0};
 try{await api("/api/clients",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});formMsg.className="success";formMsg.textContent="Клієнта створено ✓";setTimeout(async()=>{closeModal();await clientsPage()},500)}
 catch(e){formMsg.className="error";formMsg.textContent=e.message.includes("Email")?"Цей email вже використовується.":"Не вдалося створити клієнта."}
}
let s=sessionStorage.getItem("session");if(s){let x=JSON.parse(s);role=x.role;clientId=x.client_id;showApp()}
</script></body></html>
