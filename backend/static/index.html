<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Зроби себе зі мною</title>
<style>
:root{--b:#09090a;--c:#171719;--c2:#101012;--l:#2d2d31;--m:#97979f;--y:#f0c400;--w:#f5f5f6}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--w);font:16px system-ui,-apple-system,sans-serif}.wrap{max-width:980px;margin:auto;padding:24px 16px 100px}.brand{font-weight:950;font-size:25px}.y{color:var(--y)}.card{background:var(--c);border:1px solid var(--l);border-radius:20px;padding:18px;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{background:var(--c2);padding:14px;border-radius:15px}.muted{color:var(--m)}h1,h2,h3,p{margin-top:0}input,select{width:100%;padding:13px;background:var(--c2);color:white;border:1px solid var(--l);border-radius:12px;margin:5px 0 9px;font-size:16px}button{background:var(--y);color:#111;border:0;border-radius:12px;padding:12px 14px;font-weight:850}.ghost{background:#28282c;color:white}.danger{background:#392020;color:#ffb6b6}.tag{background:#29292d;border-radius:20px;padding:6px 10px;font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#111113f2;border-top:1px solid var(--l);display:flex;justify-content:center;padding:10px;z-index:3}.nav button{background:transparent;color:#aaa;font-size:12px}.nav button:hover{color:var(--y)}.hidden{display:none}.login{max-width:430px;margin:8vh auto}.logo{font-size:38px;font-weight:950;line-height:1.05;margin-bottom:25px}.client{cursor:pointer}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px 4px;border-bottom:1px solid var(--l);text-align:left}.scroll{overflow:auto}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tabs button{white-space:nowrap;background:#252529;color:white}.tabs button.on{background:var(--y);color:#111}.small{font-size:12px}.file{padding:10px 0}
</style></head><body>
<div id="login" class="wrap login"><div class="logo">ЗРОБИ СЕБЕ<br><span class="y">ЗІ МНОЮ</span></div><div class="card"><h2>Вхід</h2><p class="muted">Кабінет тренера та клієнта</p><input id="email" value="trainer@demo.local" placeholder="Email"><input id="password" type="password" value="trainer123" placeholder="Пароль"><button onclick="login()">Увійти</button><p id="err" class="muted"></p><p class="muted small">Тренер: trainer@demo.local / trainer123<br>Демо-клієнт: anna@demo.local / client123</p></div></div>
<div id="app" class="hidden"><div class="wrap"><div class="row"><div class="brand">ЗРОБИ СЕБЕ <span class="y">ЗІ МНОЮ</span></div><button class="ghost" onclick="location.reload()">Вийти</button></div><div id="content"></div></div><div class="nav" id="nav"></div></div>
<script>
let U=null,C=1,tab='overview';const $=x=>document.getElementById(x);async function api(u,o={}){let r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw Error(await r.text());return r.json()}
async function login(){try{U=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});$('login').classList.add('hidden');$('app').classList.remove('hidden');nav();U.role==='trainer'?home():openClient(U.client_id)}catch(e){$('err').textContent='Невірний email або пароль'}}
function nav(){let a=U.role==='trainer'?[['home()','Головна'],['clients()','Клієнти'],['newClient()','+ Клієнт']]:[[`openClient(${U.client_id})`,'Мій план'],['workout()','Тренування'],['food()','Харчування']];$('nav').innerHTML=a.map(x=>`<button onclick="${x[0]}">${x[1]}</button>`).join('')}
function cc(c){return `<div class="card client" onclick="openClient(${c.id})"><div class="row"><div><h3>${c.name}</h3><span class="muted">${c.goal||'Без цілі'} · ${c.weight||0} кг</span></div><span class="tag">${c.status}</span></div></div>`}
async function home(){let a=await api('/api/clients');$('content').innerHTML=`<div class="card"><h2>Панель тренера</h2><p class="muted">Активних клієнтів: ${a.length}</p><div class="grid">${a.slice(0,4).map(c=>`<div class="metric"><span class="muted">${c.name}</span><br><b>${c.weight||0} кг</b></div>`).join('')}</div></div><h2>Клієнти</h2>${a.map(cc).join('')}`}
async function clients(){let a=await api('/api/clients');$('content').innerHTML='<h2>Клієнти</h2>'+a.map(cc).join('')}
function newClient(){$('content').innerHTML=`<h2>Новий клієнт</h2><div class="card"><input id="cn" placeholder="Ім'я"><input id="ce" placeholder="Email"><input id="cp" value="client123" placeholder="Пароль"><input id="cg" placeholder="Ціль"><div class="grid"><input id="cw" type="number" placeholder="Вага"><input id="ck" type="number" placeholder="Ккал"><input id="cpr" type="number" placeholder="Білок"><input id="cf" type="number" placeholder="Жири"><input id="ccar" type="number" placeholder="Вуглеводи"></div><button onclick="saveClient()">Створити клієнта</button></div>`}
async function saveClient(){await api('/api/clients',{method:'POST',body:JSON.stringify({name:$('cn').value,email:$('ce').value,password:$('cp').value,goal:$('cg').value,weight:+$('cw').value,kcal:+$('ck').value,protein:+$('cpr').value,fat:+$('cf').value,carbs:+$('ccar').value})});clients()}
async function openClient(id){C=id;tab='overview';renderClient()}
async function renderClient(){let d=await api('/api/client/'+C),c=d.client;let tabs=`<div class="tabs"><button class="${tab==='overview'?'on':''}" onclick="tab='overview';renderClient()">Огляд</button><button class="${tab==='program'?'on':''}" onclick="tab='program';renderClient()">Програма</button><button class="${tab==='history'?'on':''}" onclick="tab='history';renderClient()">Історія</button><button class="${tab==='progress'?'on':''}" onclick="tab='progress';renderClient()">Прогрес</button></div>`;
let body='';if(tab==='overview')body=`<div class="card"><div class="row"><div><h2>${c.name}</h2><p class="muted">${c.goal}</p></div><b>${c.weight||0} кг</b></div><div class="grid"><div class="metric">Ккал<br><b>${c.kcal}</b></div><div class="metric">Білок<br><b>${c.protein} г</b></div><div class="metric">Жири<br><b>${c.fat} г</b></div><div class="metric">Вугл.<br><b>${c.carbs} г</b></div></div></div>${U.role==='trainer'?`<button class="danger" onclick="delClient()">Видалити клієнта</button>`:''}`;
if(tab==='program')body=`<div class="card"><h3>Програма</h3>${d.program.length?d.program.map(p=>`<div class="metric" style="margin:8px 0"><b>${p.day_name} · ${p.exercise}</b><br><span class="muted">${p.sets} × ${p.reps} · RIR ${p.target_rir}</span>${U.role==='trainer'?` <button class="ghost" onclick="delProgram(${p.id})">×</button>`:''}</div>`).join(''):'<p class="muted">Програма ще не створена.</p>'}</div>${U.role==='trainer'?`<div class="card"><h3>Додати вправу</h3><input id="pd" placeholder="День, напр. День A"><input id="pe" placeholder="Вправа"><div class="grid"><input id="ps" type="number" value="3" placeholder="Підходи"><input id="pr" value="8-12" placeholder="Повтори"><input id="pir" type="number" value="2" placeholder="RIR"></div><button onclick="addProgram()">Додати</button></div>`:''}`;
if(tab==='history')body=`<div class="card scroll"><h3>Історія тренувань</h3><table><tr><th>Дата</th><th>Вправа</th><th>Кг</th><th>Повт.</th><th>RIR</th></tr>${d.results.map(r=>`<tr><td>${r.day}</td><td>${r.exercise}</td><td>${r.weight}</td><td>${r.reps}</td><td>${r.rir}</td></tr>`).join('')}</table></div>`;
if(tab==='progress')body=`<div class="card"><h3>Заміри</h3>${d.measurements.map(m=>`<div class="metric" style="margin:8px 0"><b>${m.day} · ${m.weight} кг</b><br><span class="muted">Талія ${m.waist||'-'} · Груди ${m.chest||'-'} · Стегна ${m.hips||'-'}</span></div>`).join('')}</div><div class="card"><h3>Новий замір</h3><div class="grid"><input id="mw" type="number" step=".1" placeholder="Вага"><input id="mwa" type="number" step=".1" placeholder="Талія"><input id="mch" type="number" step=".1" placeholder="Груди"><input id="mhi" type="number" step=".1" placeholder="Стегна"></div><button onclick="addMeasure()">Зберегти</button></div>`;
$('content').innerHTML=tabs+body}
async function delClient(){if(confirm('Видалити клієнта та його дані?')){await api('/api/clients/'+C,{method:'DELETE'});home()}}
async function addProgram(){await api('/api/program',{method:'POST',body:JSON.stringify({client_id:C,day_name:$('pd').value,exercise:$('pe').value,sets:+$('ps').value,reps:$('pr').value,target_rir:+$('pir').value})});renderClient()}
async function delProgram(id){await api('/api/program/'+id,{method:'DELETE'});renderClient()}
async function workout(){let d=await api('/api/client/'+U.client_id);C=U.client_id;$('content').innerHTML=`<h2>Тренування</h2><div class="card"><select id="ex">${d.program.map(p=>`<option>${p.exercise}</option>`).join('')}</select><div class="grid"><input id="rw" type="number" step=".5" placeholder="Вага"><input id="rr" type="number" placeholder="Повтори"><input id="rs" type="number" value="3" placeholder="Підходи"><input id="ri" type="number" value="2" placeholder="RIR"></div><button onclick="saveWorkout()">Зберегти</button></div>`}
async function saveWorkout(){await api('/api/results',{method:'POST',body:JSON.stringify({client_id:C,exercise:$('ex').value,weight:+$('rw').value,reps:+$('rr').value,sets:+$('rs').value,rir:+$('ri').value})});alert('Збережено');workout()}
async function food(){C=U.role==='client'?U.client_id:C;let d=await api('/api/client/'+C);$('content').innerHTML=`<h2>Харчування</h2><div class="card"><div class="grid"><input id="nk" type="number" placeholder="Ккал"><input id="np" type="number" placeholder="Білок"><input id="nf" type="number" placeholder="Жири"><input id="nc" type="number" placeholder="Вуглеводи"></div><button onclick="saveFood()">Додати день</button></div>`+d.nutrition.map(n=>`<div class="card"><div class="row"><div><b>${n.day}</b><p class="muted">${n.kcal} ккал · Б${n.protein} Ж${n.fat} В${n.carbs}</p></div>${n.checked?'<span class="tag">Перевірено</span>':U.role==='trainer'?`<button onclick="checkFood(${n.id})">Перевірено</button>`:'<span class="tag">Очікує</span>'}</div>${n.screenshot?`<a href="/uploads/${n.screenshot}" target="_blank" class="y">Відкрити скрин</a>`:`<div class="file"><input type="file" id="file${n.id}" accept="image/*"><button class="ghost" onclick="upload(${n.id})">Завантажити FatSecret</button></div>`}</div>`).join('')}
async function saveFood(){await api('/api/nutrition',{method:'POST',body:JSON.stringify({client_id:C,kcal:+$('nk').value,protein:+$('np').value,fat:+$('nf').value,carbs:+$('nc').value})});food()}
async function checkFood(id){await api('/api/nutrition/'+id+'/check',{method:'PATCH'});food()}
async function upload(id){let f=$('file'+id).files[0];if(!f)return;let fd=new FormData();fd.append('file',f);await fetch('/api/nutrition/'+id+'/screenshot',{method:'POST',body:fd});food()}
async function addMeasure(){await api('/api/measurements',{method:'POST',body:JSON.stringify({client_id:C,weight:+$('mw').value,waist:+$('mwa').value,chest:+$('mch').value,hips:+$('mhi').value})});renderClient()}
</script></body></html>
