<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Зроби себе зі мною</title><style>
:root{--bg:#080909;--card:#19191c;--card2:#101012;--line:#303035;--text:#f4f4f5;--muted:#9a9aa3;--yellow:#ffd000}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:28px 20px 100px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-weight:900;font-size:28px}.brand span{color:var(--yellow)}h1,h2,h3{margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;margin-bottom:22px}.client{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.between{display:flex;justify-content:space-between;gap:14px;align-items:center}input{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px}button{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:15px;cursor:pointer;background:var(--yellow);color:#080808}button.dark{background:#29292e;color:white}button.danger{background:#402020;color:#ffb8b8}.muted{color:var(--muted)}.big{font-size:32px;font-weight:900}.badge{background:#29292e;border-radius:999px;padding:8px 13px}.exercise{background:var(--card2);border:1px solid #29292e;border-radius:16px;padding:16px;margin:10px 0}.exercise strong{font-size:18px}.tabs{display:flex;gap:8px;overflow:auto;margin:0 0 20px}.tabs button{white-space:nowrap}.hidden{display:none!important}.login{max-width:650px;margin:10vh auto}.login .brand{font-size:46px;margin-bottom:35px}.login input{margin:7px 0}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal .card{width:min(680px,100%);max-height:90vh;overflow:auto}.setrow{display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:10px;align-items:center;margin-top:10px}.setnum{font-weight:900;text-align:center}.sethead{font-size:12px;color:var(--muted);text-align:center}
.exercise-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:transparent;color:var(--text);padding:0;border-radius:0}
.exercise-toggle:hover{opacity:.9}.exercise-toggle .arrow{font-size:18px;transition:.15s}.exercise-toggle.open .arrow{transform:rotate(180deg)}
.exercise-body{margin-top:12px}.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.calendar-weekday{text-align:center;color:var(--muted);font-size:12px;padding:5px}
.calendar-day{min-height:48px;border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:12px;padding:8px 4px;text-align:center;position:relative}
.calendar-day.empty{visibility:hidden}.calendar-day.has-data{border-color:#756200}.calendar-day.has-data:after{content:'';width:6px;height:6px;border-radius:50%;background:var(--yellow);position:absolute;bottom:5px;left:50%;transform:translateX(-50%)}
.calendar-day.active{background:var(--yellow);color:#080808}.training-live{display:inline-flex;align-items:center;gap:7px;color:#6ee787;font-weight:900}.training-live:before{content:'';width:9px;height:9px;border-radius:50%;background:#39d353;box-shadow:0 0 12px #39d353}.preview-selected{outline:2px solid var(--yellow)}.calendar-day.active:after{background:#080808}.day-details{margin-top:16px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:20px 14px 90px}.brand{font-size:21px}.login .brand{font-size:38px}.card{padding:18px;border-radius:20px}.setrow{grid-template-columns:52px 1fr 1fr 1fr;gap:6px}.setrow input{padding:11px 7px;font-size:14px}}
.delta-up{color:#6ee787;font-weight:900;text-shadow:0 0 10px rgba(57,211,83,.55)}.delta-down{color:#ff7b72;font-weight:900;text-shadow:0 0 10px rgba(248,81,73,.5)}</style></head><body><div id="app"></div><script>
const A='/api'; const $=s=>document.querySelector(s);let session=JSON.parse(localStorage.getItem('fitSession')||'null');let selected=null;let calendarMonth=null;
async function api(path,opt={}){let r=await fetch(A+path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});if(!r.ok){let x;try{x=await r.json()}catch{};throw new Error(x?.detail||'Помилка сервера')}return r.status===204?null:r.json()}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shell(content){return `<div class="wrap"><div class="top"><div class="brand">ЗРОБИ СЕБЕ <span>ЗІ МНОЮ</span></div><button class="dark" onclick="logout()">Вийти</button></div>${content}</div>`}
function logout(){localStorage.removeItem('fitSession');session=null;renderLogin()}
function renderLogin(){app.innerHTML=`<div class="wrap login"><div class="brand">ЗРОБИ СЕБЕ<br><span>ЗІ МНОЮ</span></div><div class="card"><h1>Вхід</h1><input id="email" value="trainer@demo.local" placeholder="Email"><div style="position:relative"><input id="pass" type="password" value="trainer123" placeholder="Пароль" style="padding-right:52px"><button type="button" class="dark" onclick="togglePassword()" style="position:absolute;right:6px;top:13px;padding:8px 11px">👁</button></div><p id="err" class="muted"></p><button onclick="login()">Увійти</button><p class="muted">Тренер: trainer@demo.local / trainer123<br>Клієнт: використай email і пароль, створені тренером</p></div></div>`}
function togglePassword(){let p=$('#pass');if(p)p.type=p.type==='password'?'text':'password'}
async function login(){try{let s=await api('/login',{method:'POST',body:JSON.stringify({email:email.value,password:pass.value})});session=s;localStorage.setItem('fitSession',JSON.stringify(s));route()}catch(e){err.textContent=e.message}}
async function route(){if(!session)return renderLogin();if(session.role==='trainer')return trainerHome();return clientCabinet(session.client_id)}
async function trainerHome(){let cs=await api('/clients');app.innerHTML=shell(`<div class="card"><h1>Панель тренера</h1><p class="muted">Активних клієнтів: ${cs.length}</p><button onclick="newClient()">+ Додати клієнта</button></div><h1>Клієнти</h1>${cs.map(c=>`<div class="card client" onclick="openClient(${c.id})"><div class="between"><div><h2>${esc(c.name)}</h2><div class="muted">${esc(c.goal||'Без цілі')} · ${c.weight||0} кг</div></div><span class="${c.live_status==='Тренується'?'training-live':'badge'}">${esc(c.live_status||c.status||'Активний')}</span></div></div>`).join('')}`)}
function newClient(){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal"><div class="card"><div class="between"><h2>Новий клієнт</h2><button class="dark" onclick="modal.remove()">✕</button></div><div class="grid"><input id="n" placeholder="Ім'я"><input id="e" placeholder="Email"><input id="p" value="client123" placeholder="Пароль"><input id="g" placeholder="Ціль"><input id="w" type="number" placeholder="Вага, кг"><input id="k" type="number" placeholder="Ккал"><input id="pr" type="number" placeholder="Білки"><input id="f" type="number" placeholder="Жири"><input id="ca" type="number" placeholder="Вуглеводи"></div><p id="me" class="muted"></p><button onclick="createClient()">Створити клієнта</button></div></div>`)}
async function createClient(){try{await api('/clients',{method:'POST',body:JSON.stringify({name:n.value,email:e.value,password:p.value,goal:g.value,weight:+w.value||0,kcal:+k.value||0,protein:+pr.value||0,fat:+f.value||0,carbs:+ca.value||0})});modal.remove();trainerHome()}catch(x){me.textContent=x.message}}
async function openClient(id){selected=id;let d=await api('/client/'+id),c=d.client;window.currentClientData=d;app.innerHTML=shell(`<button class="dark" onclick="trainerHome()">← До клієнтів</button><div style="height:15px"></div><div class="card"><div class="between"><div><h1>${esc(c.name)}</h1><div class="muted">${esc(c.email)} · ${esc(c.goal||'Без цілі')}</div></div><div class="big">${c.weight||0} кг</div></div></div><div class="tabs"><button onclick="showTab('program',this)">Програма</button><button class="dark" onclick="showTab('results',this)">Результати</button><button class="dark" onclick="showTab('nutrition',this)">Харчування</button><button class="dark" onclick="showTab('progress',this)">Заміри</button><button class="dark" onclick="showTab('calendar',this)">Календар</button><button class="dark" onclick="showTab('comments',this)">Коментарі</button></div><div id="program" class="tab">${programHTML(d)}</div><div id="results" class="tab hidden">${resultsHTML(d)}</div><div id="nutrition" class="tab hidden">${nutritionHTML(d)}</div><div id="progress" class="tab hidden">${measureHTML(d)}</div><div id="comments" class="tab hidden">${commentsHTML(d,c.id)}</div><div id="calendar" class="tab hidden"><div class="card"><button class="exercise-toggle" onclick="toggleCalendar('trainerCalendarBody',this)"><span><strong>Календар історії</strong><span class="muted" style="display:block;margin-top:5px">Натисни, щоб відкрити календар</span></span><span class="arrow">⌄</span></button><div id="trainerCalendarBody" class="hidden" style="margin-top:14px">${calendarHTML(d,'trainer')}</div></div></div>`)}
function showTab(id,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$('#'+id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.add('dark'));btn.classList.remove('dark')}
function programHTML(d){
 let groups={}; d.program.forEach(x=>(groups[x.day_name]??=[]).push(x));
 let form=`<div class="card"><h2>Програма тренувань</h2><div class="grid"><input id="dn" placeholder="День, напр. День 1"><input id="ex" placeholder="Вправа"><input id="st" type="number" value="3" placeholder="Підходи"><input id="rp" value="8-12" placeholder="Повтори"><input id="rr" type="number" value="2" placeholder="RIR"></div><br><button onclick="addExercise()">+ Додати вправу</button></div>`;
 let list=Object.entries(groups).length ? Object.entries(groups).map(([day,xs])=>`<div class="card"><h2>${esc(day)}</h2>${xs.map(x=>`<div class="exercise between"><div><strong>${esc(x.exercise)}</strong>${x.superset_group?`<span class="badge" style="margin-left:8px;color:var(--yellow)">Суперсет</span>`:''}<div class="muted">${x.sets} підходи × ${esc(x.reps)} · RIR ${x.target_rir}</div></div><div style="display:flex;gap:8px;align-items:center"><button class="dark" title="Додати вправу в суперсет" onclick="event.stopPropagation();addSupersetExercise(${x.id},'${esc(x.day_name).replace(/'/g,"&#39;")}')">＋</button><button class="danger" onclick="deleteExercise(${x.id})">Видалити</button></div></div>`).join('')}</div>`).join('') : '<div class="card muted">Програма ще порожня.</div>';
 return form+list;
}
async function addExercise(){if(!dn.value||!ex.value)return alert('Вкажи день і вправу');await api('/program',{method:'POST',body:JSON.stringify({client_id:selected,day_name:dn.value,exercise:ex.value,sets:+st.value||3,reps:rp.value||'8-12',target_rir:+rr.value||2,superset_group:'',superset_order:0})});openClient(selected)}

function addSupersetExercise(sourceId,dayName){
 document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="supersetModal"><div class="card"><div class="between"><div><h2>Додати суперсет</h2><div class="muted">${esc(dayName)}</div></div><button class="dark" onclick="supersetModal.remove()">✕</button></div><p class="muted">Нова вправа буде автоматично об'єднана з вибраною вправою в один суперсет.</p><div class="grid"><input id="ssex" placeholder="Друга вправа"><input id="sssets" type="number" value="3" placeholder="Підходи"><input id="ssreps" value="8-12" placeholder="Повтори"><input id="ssrir" type="number" value="2" placeholder="RIR"></div><br><button onclick="saveSupersetExercise(${sourceId},'${esc(dayName).replace(/'/g,"&#39;")}')">+ Додати в суперсет</button></div></div>`)
}
async function saveSupersetExercise(sourceId,dayName){
 if(!ssex.value)return alert('Вкажи вправу');
 let group='SS'+sourceId;
 await api('/program/'+sourceId+'/superset',{method:'PATCH',body:JSON.stringify({superset_group:group})});
 await api('/program',{method:'POST',body:JSON.stringify({client_id:selected,day_name:dayName,exercise:ssex.value,sets:+sssets.value||3,reps:ssreps.value||'8-12',target_rir:+ssrir.value||2,superset_group:group,superset_order:1})});
 supersetModal.remove();openClient(selected)
}

async function deleteExercise(id){if(confirm('Видалити вправу?')){await api('/program/'+id,{method:'DELETE'});openClient(selected)}}

function toggleExercise(id,btn){let b=$('#'+id);if(!b)return;b.classList.toggle('hidden');btn.classList.toggle('open')}
function isoToday(){let x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function monthKey(day){return day ? day.slice(0,7) : ''}
function calendarHTML(d,mode='trainer'){
 let days=[...(d.result_sets||[]).map(x=>x.day),...(d.results||[]).map(x=>x.day),...(d.nutrition||[]).map(x=>x.day),...(d.measurements||[]).map(x=>x.day)].filter(Boolean);
 let unique=[...new Set(days)];
 if(!calendarMonth) calendarMonth=(unique.sort().reverse()[0]||isoToday()).slice(0,7);
 let ym=calendarMonth,[yy,mm]=ym.split('-').map(Number);
 let first=new Date(yy,mm-1,1),count=new Date(yy,mm,0).getDate(),start=(first.getDay()+6)%7;
 let cells='';for(let i=0;i<start;i++)cells+='<button class="calendar-day empty"></button>';
 for(let n=1;n<=count;n++){let day=ym+'-'+String(n).padStart(2,'0'),has=unique.includes(day);cells+=`<button class="calendar-day ${has?'has-data':''}" data-day="${day}" onclick="showCalendarDay('${day}',this)">${n}</button>`}
 let monthNames=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
 return `<div class="card"><div class="calendar-head"><button class="dark" onclick="changeCalendarMonth(-1,'${mode}')">←</button><div style="text-align:center"><h2 style="margin-bottom:4px">${monthNames[mm-1]} ${yy}</h2><div class="muted">жовта крапка = є записи</div></div><button class="dark" onclick="changeCalendarMonth(1,'${mode}')">→</button></div><div class="calendar-grid">${['Пн','Вт','Ср','Чт','Пт','Сб','Нд'].map(x=>`<div class="calendar-weekday">${x}</div>`).join('')}${cells}</div><div id="calendarDetails" class="day-details muted">Натисни на день, щоб переглянути записи.</div></div>`;
}
function toggleCalendar(id,btn){
 let el=$('#'+id);if(!el)return;
 el.classList.toggle('hidden');
 btn.classList.toggle('open');
 let a=btn.querySelector('.arrow');if(a)a.textContent=el.classList.contains('hidden')?'⌄':'⌃';
}
function changeCalendarMonth(delta,mode){
 let [y,m]=calendarMonth.split('-').map(Number),d=new Date(y,m-1+delta,1);
 calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
 let data=window.currentClientData||{};
 if(mode==='trainer'){let el=$('#trainerCalendarBody');if(el)el.innerHTML=calendarHTML(data,'trainer')}
 else {let el=$('#clientCalendar');if(el)el.innerHTML=calendarHTML(data,'client')}
}

function historyNutritionForm(day,cid){
 return `<div class="exercise"><div class="grid"><input id="hkcal" type="number" placeholder="Ккал"><input id="hprotein" type="number" placeholder="Білки, г"><input id="hfat" type="number" placeholder="Жири, г"><input id="hcarbs" type="number" placeholder="Вуглеводи, г"></div><br><button onclick="saveHistoryNutrition('${day}',${cid})">Додати харчування</button></div>`;
}
async function saveHistoryNutrition(day,cid){
 let body={client_id:cid,day,kcal:+hkcal.value||0,protein:+hprotein.value||0,fat:+hfat.value||0,carbs:+hcarbs.value||0};
 await api('/history/nutrition',{method:'POST',body:JSON.stringify(body)});
 let d=await api('/client/'+cid);window.currentClientData=d;showCalendarDay(day,null)
}
function historyWorkoutForm(day,cid,d){
 let groups={};(d.program||[]).forEach(x=>(groups[x.day_name]??=[]).push(x));
 return `<div class="exercise"><div class="muted">Додати пропущене тренування</div><select id="historyDaySelect" onchange="renderHistoryWorkoutExercises('${day}',${cid})" style="width:100%;margin-top:10px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px"><option value="">Оберіть тренування</option>${Object.keys(groups).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><div id="historyWorkoutExercises"></div></div>`;
}
function renderHistoryWorkoutExercises(day,cid){
 let d=window.currentClientData||{},name=$('#historyDaySelect').value,items=(d.program||[]).filter(x=>x.day_name===name),box=$('#historyWorkoutExercises');if(!box)return;
 box.innerHTML=items.map(x=>`<div class="exercise"><strong>${esc(x.exercise)}</strong>${x.superset_group?`<span class="badge" style="margin-left:8px;color:var(--yellow)">Суперсет</span>`:''}${Array.from({length:x.sets},(_,i)=>`<div class="setrow"><div class="setnum">${i+1}</div><input id="hw${x.id}_${i+1}" type="number" step="0.5" placeholder="кг"><input id="hr${x.id}_${i+1}" type="number" placeholder="${esc(x.reps)}"><input id="hi${x.id}_${i+1}" type="number" value="${x.target_rir}" min="0" max="10"></div>`).join('')}</div>`).join('')+`<button onclick="saveHistoryWorkout('${day}',${cid},'${esc(name).replace(/'/g,"&#39;")}')">Зберегти тренування</button>`;
}
async function saveHistoryWorkout(day,cid,name){
 let d=window.currentClientData||{},items=(d.program||[]).filter(x=>x.day_name===name),sets=[];
 for(let x of items){for(let n=1;n<=x.sets;n++){let w=$('#hw'+x.id+'_'+n),r=$('#hr'+x.id+'_'+n),i=$('#hi'+x.id+'_'+n);if(!w||(!w.value&&!r.value))continue;if(!w.value||!r.value)return alert('Заповни вагу та повтори');sets.push({program_id:x.id,exercise:x.exercise,set_number:n,weight:+w.value,reps:+r.value,rir:+i.value||0})}}
 if(!sets.length)return alert('Додай хоча б один підхід');
 await api('/history/workout',{method:'POST',body:JSON.stringify({client_id:cid,day,day_name:name,sets})});
 let nd=await api('/client/'+cid);window.currentClientData=nd;showCalendarDay(day,null)
}

function showCalendarDay(day,btn){
 let d=window.currentClientData||{};
 let sets=(d.result_sets||[]).filter(x=>x.day===day);
 let old=(d.results||[]).filter(x=>x.day===day);
 let nut=(d.nutrition||[]).filter(x=>x.day===day).sort((a,b)=>b.id-a.id);
 let sessions=(d.workout_sessions||[]).filter(x=>(x.started_at||'').slice(0,10)===day).sort((a,b)=>b.id-a.id);
 let session=sessions[0]||null;
 let meas=(d.measurements||[]).filter(x=>x.day===day);

 let by={};sets.forEach(x=>{let k=x.program_id+'|'+x.exercise;(by[k]??=[]).push(x)});
 let workoutGroups=Object.values(by),workoutHTML='';
 if(workoutGroups.length){
   workoutHTML=workoutGroups.map(xs=>{xs.sort((a,b)=>a.set_number-b.set_number);return `<div class="exercise"><strong>${esc(xs[0].exercise)}</strong>${xs.map(s=>`<div class="muted" style="margin-top:6px">Підхід ${s.set_number}: ${s.weight} кг × ${s.reps} · RIR ${s.rir}</div>`).join('')}</div>`}).join('');
 }else if(old.length){
   workoutHTML=old.map(x=>`<div class="exercise"><strong>${esc(x.exercise)}</strong><div class="muted">${x.weight} кг × ${x.reps} · ${x.sets} підходи · RIR ${x.rir}</div></div>`).join('');
 }else workoutHTML='<div class="exercise muted">Тренування за цей день не записано.</div>'+(day<=isoToday()?historyWorkoutForm(day,d.client.id,d):'<div class="exercise muted">На майбутню дату дані додавати не можна.</div>');

 let sessionHTML=session?`<div class="exercise"><div class="muted">Тренування</div><strong>${esc(session.day_name)}</strong><div class="muted" style="margin-top:5px">${session.status==='finished'?'Завершено':'Тренування триває'}</div></div>`:'';
 let nutritionHTML=nut.length?`<div class="exercise"><strong>${nut[0].kcal} ккал</strong><div class="muted">Б ${nut[0].protein} г · Ж ${nut[0].fat} г · В ${nut[0].carbs} г</div></div>`:'<div class="exercise muted">Харчування за цей день не внесено.</div>'+(day<=isoToday()?historyNutritionForm(day,d.client.id):'<div class="exercise muted">На майбутню дату дані додавати не можна.</div>');
 let measures=meas.length?`<div class="card"><h2>Заміри</h2>${meas.map(x=>`<div class="exercise">${x.weight} кг${x.waist?' · талія '+x.waist+' см':''}</div>`).join('')}</div>`:'';

 let content=`<button class="dark" onclick="returnFromCalendarDay()">← До календаря</button><div style="height:16px"></div><div class="card"><div class="muted">Щоденник</div><h1>${esc(day)}</h1></div><div class="card"><h2>Тренування</h2>${sessionHTML}${workoutHTML}</div><div class="card"><h2>Харчування</h2>${nutritionHTML}</div>${commentsHTML(d,d.client.id,day)}${measures}`;
 window.calendarReturnHTML=app.innerHTML;
 app.innerHTML=shell(content);
}
function returnFromCalendarDay(){
 if(session&&session.role==='trainer'&&selected){openClient(selected);return}
 if(session&&session.role==='client'&&session.client_id){clientCabinet(session.client_id);return}
 route()
}

function resultDelta(v){
 let n=+v||0;
 if(n>0)return `<span class="delta-up">+${Number.isInteger(n)?n:n.toFixed(1)}</span>`;
 if(n<0)return `<span class="delta-down">${Number.isInteger(n)?n:n.toFixed(1)}</span>`;
 return `<span class="muted">0</span>`;
}
function toggleResultExercise(id,btn){
 let el=$('#'+id);if(!el)return;
 el.classList.toggle('hidden');
 let a=btn.querySelector('.arrow');if(a)a.textContent=el.classList.contains('hidden')?'⌄':'⌃';
}

function resultDelta(v){
 let n=+v||0;
 if(n>0)return `<span class="delta-up">+${Number.isInteger(n)?n:n.toFixed(1)}</span>`;

function trainerResultDates(d,dayName){
 let program=(d.program||[]).filter(x=>x.day_name===dayName),pids=new Set(program.map(x=>x.id));
 let sessions=(d.workout_sessions||[]).filter(s=>s.day_name===dayName&&s.status==='finished');
 let sessionDates=sessions.map(s=>(s.started_at||'').slice(0,10)).filter(Boolean);
 let setDates=(d.result_sets||[]).filter(r=>pids.has(r.program_id)).map(r=>r.day);
 return [...new Set([...sessionDates,...setDates])].sort().reverse();
}
function periodStart(period){
 let d=new Date();
 if(period==='30')d.setDate(d.getDate()-30);
 else if(period==='90')d.setDate(d.getDate()-90);
 else if(period==='180')d.setDate(d.getDate()-180);
 else return null;
 return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function trainerDayResultsHTML(d,dayName){
 let program=(d.program||[]).filter(x=>x.day_name===dayName);
 let allDates=trainerResultDates(d,dayName);
 let period=window.trainerResultsPeriod||'90',from=periodStart(period);
 let customFrom=window.trainerResultsFrom||'',customTo=window.trainerResultsTo||'';
 let dates=allDates.filter(day=>{
   if(period==='custom')return (!customFrom||day>=customFrom)&&(!customTo||day<=customTo);
   return !from||day>=from;
 });
 let limit=window.trainerResultsLimit||5,shown=dates.slice(0,limit);

 if(!dates.length)return `<div class="card"><p class="muted">У вибраному періоді немає тренувань ${esc(dayName)}.</p></div>`;

 let cards=shown.map(day=>{
   let allIndex=allDates.indexOf(day),previous=allDates[allIndex+1]||null;
   let exercises=program.filter(x=>(d.result_sets||[]).some(r=>r.program_id===x.id&&r.day===day));
   return `<div class="card">
    <div class="between"><div><div class="muted">${esc(dayName)}</div><h2>${esc(day)}</h2></div>${previous?`<span class="muted">порівняно з ${esc(previous)}</span>`:''}</div>
    ${exercises.map(x=>{
      let cur=(d.result_sets||[]).filter(r=>r.program_id===x.id&&r.day===day).sort((a,b)=>a.set_number-b.set_number);
      let prev=previous?(d.result_sets||[]).filter(r=>r.program_id===x.id&&r.day===previous).sort((a,b)=>a.set_number-b.set_number):[];
      let bodyId=`trainerResult_${x.id}_${day.replaceAll('-','_')}`;
      return `<div class="exercise">
       <button class="exercise-toggle" onclick="toggleResultExercise('${bodyId}',this)">
        <span><strong>${esc(x.exercise)}</strong>${x.superset_group?`<span class="badge" style="margin-left:8px;color:var(--yellow)">Суперсет</span>`:''}<span class="muted" style="display:block;margin-top:5px">${cur.length} підходи</span></span><span class="arrow">⌄</span>
       </button>
       <div id="${bodyId}" class="hidden" style="margin-top:10px">${cur.map(s=>{
        let p=prev.find(z=>z.set_number===s.set_number);
        return `<div style="padding:8px 0;border-top:1px solid var(--line)"><div>Підхід ${s.set_number}: <strong>${s.weight} кг × ${s.reps}</strong> · RIR ${s.rir}</div>${p?`<div class="muted" style="margin-top:4px">Минулого ${p.weight} кг × ${p.reps} · різниця: вага ${resultDelta((+s.weight)-(+p.weight))} кг · повтори ${resultDelta((+s.reps)-(+p.reps))}</div>`:'<div class="muted" style="margin-top:4px">Немає попереднього результату для порівняння.</div>'}</div>`;
       }).join('')}</div>
      </div>`;
    }).join('')}
   </div>`;
 }).join('');

 return cards+(dates.length>shown.length?`<div style="text-align:center;margin:16px 0 28px"><button class="dark" onclick="window.trainerResultsLimit=(window.trainerResultsLimit||5)+5;document.querySelector('#results').innerHTML=resultsHTML(window.currentClientData)">Показати ще (${dates.length-shown.length})</button></div>`:'');

function signedDelta(v){
 let n=+v||0;
 if(n>0)return `<span class="delta-up">+${Number.isInteger(n)?n:n.toFixed(1)}</span>`;
 if(n<0)return `<span class="delta-down">${Number.isInteger(n)?n:n.toFixed(1)}</span>`;

 return `<div class="exercise" style="margin-top:12px">

      </div>`;
   }).join('')}
 </div>`;
}

function commentsHTML(d,cid,day=isoToday()){
 let xs=(d.comments||[]).filter(x=>x.day===day);
 return `<div class="card"><h2>Коментарі</h2>${xs.length?xs.map(x=>`<div class="exercise"><strong>${x.author==='trainer'?'Тренер':'Клієнт'}</strong><div style="margin-top:6px">${esc(x.body)}</div></div>`).join(''):'<p class="muted">Коментарів ще немає.</p>'}<textarea id="commentText" placeholder="Написати коментар..." style="width:100%;min-height:90px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px;font:inherit;resize:vertical"></textarea><br><br><button onclick="saveComment(${cid},'${day}')">Надіслати</button></div>`;
}
async function saveComment(cid,day){
 let t=$('#commentText');if(!t||!t.value.trim())return alert('Напиши коментар');
 await api('/comments',{method:'POST',body:JSON.stringify({client_id:cid,day,program_id:0,exercise:'',author:session.role,body:t.value.trim()})});
 let d=await api('/client/'+cid);window.currentClientData=d;
 if(session.role==='trainer')openClient(cid);else clientCabinet(cid)
}
function previewExercisesHTML(items){
 let used=new Set(),html='';
 for(let x of items){
  if(used.has(x.id))continue;
  if(x.superset_group){
   let pair=items.filter(y=>y.superset_group===x.superset_group);
   pair.forEach(y=>used.add(y.id));
   html+=`<div class="exercise" style="border-color:#6b5b00;padding:0;overflow:hidden"><div style="padding:12px 16px;background:#232116;border-bottom:1px solid #4d4300"><strong style="color:var(--yellow)">Суперсет</strong></div><div style="padding:6px 16px">${pair.map((y,i)=>`<div style="padding:12px 0;${i<pair.length-1?'border-bottom:1px solid var(--line)':''}"><strong>${esc(y.exercise)}</strong><div class="muted">План: ${y.sets} × ${esc(y.reps)} · RIR ${y.target_rir}</div></div>`).join('')}</div></div>`;
  }else{
   used.add(x.id);
   html+=`<div class="exercise"><strong>${esc(x.exercise)}</strong><div class="muted">План: ${x.sets} × ${esc(x.reps)} · RIR ${x.target_rir}</div></div>`;
  }
 }
 return html;
}

async function clientCabinet(id){
 let d=await api('/client/'+id),c=d.client;window.currentClientData=d;let groups={};d.program.forEach(x=>(groups[x.day_name]??=[]).push(x));
 let active=(d.workout_sessions||[]).find(x=>x.status==='training');
 if(active) previewWorkoutDay=active.day_name;
 let chosen=active?active.day_name:previewWorkoutDay;
 let programPart='';
 if(active){
   programPart=`<h1>${esc(active.day_name)}</h1><div class="card"><div class="training-live">Тренування триває</div><div style="height:12px"></div>${activeExercisesHTML(groups[active.day_name]||[],d,id)}</div>`;
 }else if(chosen){
   programPart=`<h1>Перегляд: ${esc(chosen)}</h1><div class="card">${previewExercisesHTML(groups[chosen]||[])}</div>`;
 }else programPart='<div class="card muted">Обери тренування вище, щоб переглянути вправи.</div>';
 app.innerHTML=shell(`<div class="card"><h1>Привіт, ${esc(c.name)}</h1><p class="muted">${esc(c.goal||'Твоя програма')}</p><div class="big">${c.weight||0} кг</div></div><div class="card"><h2>Моє харчування</h2><p>${c.kcal||0} ккал · Б ${c.protein||0} · Ж ${c.fat||0} · В ${c.carbs||0}</p></div>${dailyNutritionHTML(d,id)}${workoutChooser(d,id,groups)}${programPart}${commentsHTML(d,id)}<div class="card" style="margin-top:28px"><button class="exercise-toggle" onclick="toggleCalendar('clientCalendarBody',this)"><span><strong>Моя історія</strong><span class="muted" style="display:block;margin-top:5px">Календар тренувань, харчування та замірів</span></span><span class="arrow">⌄</span></button><div id="clientCalendarBody" class="hidden" style="margin-top:14px"><div id="clientCalendar">${calendarHTML(d,'client')}</div></div></div>`)
}
async function saveSets(cid,pid,exercise,count){
 let sets=[];
 for(let n=1;n<=count;n++){
  let w=$(`#w${pid}_${n}`),r=$(`#r${pid}_${n}`),i=$(`#i${pid}_${n}`);
  if(!w.value&&!r.value)continue;
  if(!w.value||!r.value)return alert(`Заповни вагу та повтори у підході ${n}`);
  sets.push({set_number:n,weight:+w.value,reps:+r.value,rir:+i.value||0})
 }
 if(!sets.length)return alert('Заповни хоча б один підхід');
 await api('/result-sets',{method:'POST',body:JSON.stringify({client_id:cid,program_id:pid,exercise,sets})});
 let body=$('#exerciseBody'+pid);
 if(body){
   body.innerHTML=`<div class="exercise" style="margin-top:12px"><strong>Виконано ✓</strong>${sets.map(s=>`<div class="muted" style="margin-top:6px">Підхід ${s.set_number}: ${s.weight} кг × ${s.reps} · RIR ${s.rir}</div>`).join('')}<div style="margin-top:12px"><button class="dark" onclick="clientCabinet(${cid})">Редагувати</button></div></div>`;
   body.classList.add('hidden');
   let toggle=body.previousElementSibling;if(toggle)toggle.classList.remove('open');
 }
 let d=await api('/client/'+cid);window.currentClientData=d;
 let cal=$('#clientCalendar');if(cal)cal.innerHTML=calendarHTML(d,'client');
 setTimeout(()=>clientCabinet(cid),350);
}
route();
</script></body></html>
