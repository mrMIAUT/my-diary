<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Зроби себе зі мною</title>
<style>
:root{--bg:#0b0b0c;--card:#171719;--muted:#96969d;--line:#29292d;--yellow:#f0c400;--white:#f5f5f5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Inter,system-ui,-apple-system,Arial}
.wrap{max-width:980px;margin:auto;padding:20px 16px 90px}.brand{font-size:24px;font-weight:900}.accent{color:var(--yellow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}.muted{color:var(--muted)}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#101012;color:white;margin:6px 0 10px;font-size:16px}
button{border:0;border-radius:12px;padding:12px 15px;font-weight:800;background:var(--yellow);color:#111;cursor:pointer}
button.ghost{background:#252529;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#101012;padding:13px;border-radius:14px}
.metric b{font-size:21px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.client{cursor:pointer}.client:hover{border-color:#555}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111113eF;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:10px;backdrop-filter:blur(10px)}
.nav button{background:transparent;color:#aaa;font-size:12px;padding:8px}.nav button.active{color:var(--yellow)}
h1,h2,h3,p{margin-top:0}.tag{font-size:12px;background:#252529;border-radius:20px;padding:6px 9px}.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:9px 5px;border-bottom:1px solid var(--line)}
.login{max-width:430px;margin:8vh auto}.logo{font-size:34px;font-weight:950;line-height:1.05;margin-bottom:25px}
@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.wrap{padding-top:16px}.brand{font-size:20px}}
</style></head><body>
<div id="login" class="wrap login">
 <div class="logo">ЗРОБИ СЕБЕ<br><span class="accent">ЗІ МНОЮ</span></div>
 <div class="card"><h2>Вхід</h2><p class="muted">Кабінет тренера та клієнта</p>
 <input id="email" placeholder="Email" value="trainer@demo.local"><input id="password" type="password" placeholder="Пароль" value="trainer123">
 <button onclick="login()">Увійти</button><p id="err" class="muted"></p>
 <p class="muted" style="font-size:12px;margin-top:18px">Тренер: trainer@demo.local / trainer123<br>Клієнт: anna@demo.local / client123</p></div>
</div>
<div id="app" class="hidden"><div class="wrap">
 <div class="row"><div class="brand">ЗРОБИ СЕБЕ <span class="accent">ЗІ МНОЮ</span></div><button class="ghost" onclick="logout()">Вийти</button></div>
 <div id="content"></div>
</div><div class="nav" id="nav"></div></div>
<script>
let user=null, selected=1;
const $=x=>document.getElementById(x);
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});if(!r.ok)throw Error(await r.text());return r.json()}
async function login(){try{user=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});$('login').classList.add('hidden');$('app').classList.remove('hidden');setupNav(); home()}catch(e){$('err').textContent='Невірний email або пароль'}}
function logout(){location.reload()}
function setupNav(){let items=user.role==='trainer'?[['home','Головна'],['clients','Клієнти'],['nutrition','Харчування']]:[['home','Головна'],['workout','Тренування'],['nutrition','Харчування']];$('nav').innerHTML=items.map(x=>`<button onclick="${x[0]}()">${x[1]}</button>`).join('')}
async function home(){if(user.role==='client'){selected=user.client_id;return client(selected)} let cs=await api('/api/clients');$('content').innerHTML=`<div class="card"><h2>Панель тренера</h2><p class="muted">Активних клієнтів: ${cs.length}</p><div class="grid">${cs.map(c=>`<div class="metric"><span class="muted">${c.name}</span><br><b>${c.weight} кг</b></div>`).join('')}</div></div><h2>Клієнти</h2>${cs.map(c=>clientCard(c)).join('')}`}
function clientCard(c){return `<div class="card client" onclick="client(${c.id})"><div class="row"><div><h3>${c.name}</h3><span class="muted">${c.goal}</span></div><span class="tag">${c.status}</span></div></div>`}
async function clients(){let cs=await api('/api/clients');$('content').innerHTML='<h2>Клієнти</h2>'+cs.map(clientCard).join('')}
async function client(id){selected=id;let d=await api('/api/client/'+id),c=d.client;let latest=d.results.slice(-6).reverse();$('content').innerHTML=`<div class="card"><div class="row"><div><h2>${c.name}</h2><p class="muted">${c.goal}</p></div><b>${c.weight} кг</b></div><div class="grid"><div class="metric"><span class="muted">Ккал</span><br><b>${c.kcal}</b></div><div class="metric"><span class="muted">Білок</span><br><b>${c.protein} г</b></div><div class="metric"><span class="muted">Жири</span><br><b>${c.fat} г</b></div></div></div><div class="card"><h3>Останні тренування</h3><table><tr><th>Вправа</th><th>Вага</th><th>Повт.</th><th>RIR</th></tr>${latest.map(r=>`<tr><td>${r.exercise}</td><td>${r.weight}</td><td>${r.reps}</td><td>${r.rir}</td></tr>`).join('')}</table></div><div class="card"><h3>Додати вагу тіла</h3><input id="bw" type="number" step=".1" placeholder="Вага, кг"><button onclick="addWeight()">Зберегти</button></div>`}
async function workout(){$('content').innerHTML=`<h2>Тренування</h2><div class="card"><h3>Записати підхід</h3><select id="ex"><option>Присідання</option><option>Жим лежачи</option><option>Румунська тяга</option><option>Тяга верхнього блока</option></select><div class="grid"><input id="w" type="number" step=".5" placeholder="Вага"><input id="reps" type="number" placeholder="Повтори"><input id="sets" type="number" value="3" placeholder="Підходи"><input id="rir" type="number" value="2" placeholder="RIR"></div><button onclick="addResult()">Зберегти тренування</button></div>`}
async function addResult(){await api('/api/results',{method:'POST',body:JSON.stringify({client_id:selected,exercise:$('ex').value,weight:+$('w').value,reps:+$('reps').value,sets:+$('sets').value,rir:+$('rir').value})});alert('Тренування збережено');client(selected)}
async function nutrition(){let id=user.role==='client'?user.client_id:selected;let d=await api('/api/client/'+id);$('content').innerHTML=`<h2>Харчування</h2><div class="card"><h3>Додати КБЖУ</h3><div class="grid"><input id="nk" type="number" placeholder="Ккал"><input id="np" type="number" placeholder="Білок"><input id="nf" type="number" placeholder="Жири"><input id="nc" type="number" placeholder="Вуглеводи"></div><button onclick="addNutrition(${id})">Зберегти</button></div>`+d.nutrition.slice().reverse().map(n=>`<div class="card"><div class="row"><div><b>${n.day}</b><p class="muted">${n.kcal} ккал · Б ${n.protein} · Ж ${n.fat} · В ${n.carbs}</p></div>${n.checked?'<span class="tag">Перевірено</span>':user.role==='trainer'?`<button onclick="checkN(${n.id})">Перевірено</button>`:'<span class="tag">Очікує</span>'}</div></div>`).join('')}
async function addNutrition(id){await api('/api/nutrition',{method:'POST',body:JSON.stringify({client_id:id,kcal:+$('nk').value,protein:+$('np').value,fat:+$('nf').value,carbs:+$('nc').value})});nutrition()}
async function checkN(id){await api('/api/nutrition/'+id+'/check',{method:'PATCH'});nutrition()}
async function addWeight(){await api('/api/weight',{method:'POST',body:JSON.stringify({client_id:selected,weight:+$('bw').value})});client(selected)}
</script></body></html>
