<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fb"><title>Є ПЛАН 1.2 · Калькулятор</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 18px 40px}.brand{font-size:14px;font-weight:800;letter-spacing:.08em;color:#2766d6}.card{margin-top:18px;background:#fff;border:1px solid #e3e8ef;border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(20,35,60,.05)}h1{font-size:28px;margin:8px 0}p{color:#6e7b8d;line-height:1.45;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:700;color:#566477}label.wide{grid-column:1/-1}input,select{width:100%;height:48px;border:1px solid #dce3ec;border-radius:11px;background:#fff;padding:0 12px;font:inherit;color:#172033}button{width:100%;height:50px;margin-top:16px;border:0;border-radius:12px;background:#2468d8;color:#fff;font-size:15px;font-weight:800}.result{display:none;margin-top:16px;background:#f7faff;border:1px solid #dce7f6;border-radius:16px;padding:18px}.result.show{display:block}.kicker{font-size:12px;color:#718096;font-weight:800}.kcal{display:block;font-size:30px;margin:5px 0 16px}.kcal small{font-size:13px;color:#7b8797}.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.macro{background:#fff;border:1px solid #e1e7ef;border-radius:11px;padding:10px;text-align:center}.macro b{font-size:19px}.macro small{display:block;color:#7b8797;margin-top:3px}.note{font-size:12px;margin:14px 0 0}.badge{display:inline-block;background:#eaf2ff;color:#245cae;border-radius:99px;padding:6px 9px;font-size:11px;font-weight:800}.goalBox{grid-column:1/-1;background:#f8fafc;border:1px solid #e4e9f0;border-radius:14px;padding:14px}.goalBox strong{font-size:13px}.goalHint{display:block;color:#7b8797;font-size:12px;font-weight:500;margin-top:5px}.pace{margin-top:12px;padding:11px 12px;background:#fff;border:1px solid #e1e7ef;border-radius:11px;font-size:13px}.pace b{display:block;font-size:16px;margin-top:3px}@media(max-width:480px){.grid{grid-template-columns:1fr}label.wide,.goalBox{grid-column:auto}}
</style></head><body><main class="wrap"><div class="brand">Є ПЛАН 1.2</div><section class="card"><span class="badge">ПРОТОТИП</span><h1>Калькулятор калорій і БЖВ</h1><p>Розрахуємо стартовий орієнтир. Дані цього прототипу не зберігаються.</p><div class="grid">
<label>Стать<select id="sex"><option value="male">Чоловіча</option><option value="female">Жіноча</option></select></label>
<label>Вік<input id="age" type="number" inputmode="numeric" placeholder="років"></label>
<label>Зріст<input id="height" type="number" inputmode="decimal" placeholder="см"></label>
<label>Вага<input id="weight" type="number" inputmode="decimal" placeholder="кг"></label>
<label>Жир, % · необов’язково<input id="bf" type="number" inputmode="decimal" placeholder="%"></label>
<label>Кроки за день<input id="steps" type="number" inputmode="numeric" value="7000" placeholder="середнє за день"></label>
<label>Силові / тиждень<select id="strength"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option></select></label>
<label>Кардіо / тиждень<select id="cardio"><option value="0" selected>0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option></select></label>
<label>Кардіо, хв / сесію<input id="cardioMin" type="number" inputmode="numeric" value="30" placeholder="хв"></label>
<label class="wide">Тренувальний досвід<select id="experience"><option value="novice">До 6 місяців</option><option value="intermediate" selected>6–24 місяці</option><option value="advanced">Понад 2 роки</option></select></label>
<label class="wide">Ціль<select id="goal"><option value="loss">Зменшення жиру</option><option value="recomp">Рекомпозиція тіла</option><option value="maintain" selected>Підтримання форми</option><option value="gain">Набір м’язової маси</option></select></label>
<label class="wide" id="adjustWrap">Корекція від підтримання<select id="adjust"></select><small id="adjustHint" style="font-weight:500;color:#7b8797"></small></label>
</div><button id="calcBtn" type="button">Розрахувати</button><div class="result" id="result"></div><p id="calcError" style="display:none;color:#b42318;font-size:13px;margin-top:12px"></p></section></main><script src="/static/calculator-prototype.js?v=8" defer></script></body></html>
