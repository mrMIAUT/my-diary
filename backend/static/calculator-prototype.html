<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f8fb"><title>Є ПЛАН 1.2 · Калькулятор</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:620px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 18px 40px}.brand{font-size:14px;font-weight:800;letter-spacing:.08em;color:#2766d6}.card{margin-top:18px;background:#fff;border:1px solid #e3e8ef;border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(20,35,60,.05)}h1{font-size:28px;margin:8px 0}p{color:#6e7b8d;line-height:1.45;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:700;color:#566477}label.wide{grid-column:1/-1}input,select{width:100%;height:48px;border:1px solid #dce3ec;border-radius:11px;background:#fff;padding:0 12px;font:inherit;color:#172033}button{width:100%;height:50px;margin-top:16px;border:0;border-radius:12px;background:#2468d8;color:#fff;font-size:15px;font-weight:800}.result{display:none;margin-top:16px;background:#f7faff;border:1px solid #dce7f6;border-radius:16px;padding:18px}.result.show{display:block}.kicker{font-size:12px;color:#718096;font-weight:800}.kcal{display:block;font-size:30px;margin:5px 0 16px}.kcal small{font-size:13px;color:#7b8797}.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.macro{background:#fff;border:1px solid #e1e7ef;border-radius:11px;padding:10px;text-align:center}.macro b{font-size:19px}.macro small{display:block;color:#7b8797;margin-top:3px}.note{font-size:12px;margin:14px 0 0}.badge{display:inline-block;background:#eaf2ff;color:#245cae;border-radius:99px;padding:6px 9px;font-size:11px;font-weight:800}@media(max-width:480px){.grid{grid-template-columns:1fr}label.wide{grid-column:auto}}
</style></head><body><main class="wrap"><div class="brand">Є ПЛАН 1.2</div><section class="card"><span class="badge">ПРОТОТИП</span><h1>Калькулятор калорій і БЖВ</h1><p>Розрахуємо стартовий орієнтир. Дані цього прототипу не зберігаються.</p><div class="grid">
<label>Стать<select id="sex"><option value="male">Чоловіча</option><option value="female">Жіноча</option></select></label>
<label>Вік<input id="age" type="number" inputmode="numeric" placeholder="років"></label>
<label>Зріст<input id="height" type="number" inputmode="decimal" placeholder="см"></label>
<label>Вага<input id="weight" type="number" inputmode="decimal" placeholder="кг"></label>
<label>Жир, % · необов’язково<input id="bf" type="number" inputmode="decimal" placeholder="%"></label>
<label>Активність<select id="activity"><option value="1.2">Мінімальна</option><option value="1.375">Легка</option><option value="1.55" selected>Середня</option><option value="1.725">Висока</option><option value="1.9">Дуже висока</option></select></label>
<label class="wide">Ціль<select id="goal"><option value="loss">Зменшення жиру</option><option value="recomp">Рекомпозиція тіла</option><option value="maintain" selected>Підтримання форми</option><option value="gain">Набір м’язової маси</option></select></label>
</div><button onclick="calc()">Розрахувати</button><div class="result" id="result"></div></section></main><script>
function calc(){let sex=document.getElementById('sex').value,age=+document.getElementById('age').value,h=+document.getElementById('height').value,w=+document.getElementById('weight').value,bf=+document.getElementById('bf').value||0,a=+document.getElementById('activity').value,g=document.getElementById('goal').value;if(!age||!h||!w||age<18||age>100||h<120||h>230||w<35||w>300){alert('Перевір вік, зріст і вагу.');return}if(bf&&(bf<3||bf>60)){alert('Перевір відсоток жиру.');return}let ffm=bf?w*(1-bf/100):null;let rmr=ffm?500+22*ffm:10*w+6.25*h-5*age+(sex==='male'?5:-161);let tdee=rmr*a;let factor=g==='loss'?.85:g==='recomp'?.95:g==='gain'?1.08:1;let kcal=Math.round(tdee*factor/10)*10;let protein=Math.round((ffm||w)*(g==='loss'||g==='recomp'?2.0:1.8));let fat=Math.round(w*.8);let carbs=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));let method=ffm?'Cunningham · за безжировою масою':'Mifflin–St Jeor · без % жиру';let goal=g==='loss'?'дефіцит 15%':g==='recomp'?'невеликий дефіцит 5%':g==='gain'?'профіцит 8%':'підтримання';let result=document.getElementById('result');result.className='result show';result.innerHTML='<span class="kicker">СТАРТОВИЙ ОРІЄНТИР</span><strong class="kcal">'+kcal.toLocaleString('uk-UA')+' <small>ккал/день</small></strong><div class="macros"><div class="macro"><b>'+protein+'</b> г<small>Білки</small></div><div class="macro"><b>'+fat+'</b> г<small>Жири</small></div><div class="macro"><b>'+carbs+'</b> г<small>Вуглеводи</small></div></div><p class="note">'+method+' · '+goal+'. Це початкова оцінка, а не точне вимірювання витрат енергії.</p>'}
</script></body></html>
